# DEFINITION — group appearance
atom_id: DEF-HABERMAS-GROUP-APPEARANCE-001
uuid: 8b4f0a23-5d9e-6c2f-af4f-9e25f56fdefb
term: "group appearance"
type: definition
plain: "An experience in which multiple people simultaneously thought they saw the risen Jesus and interpreted it as a shared sighting of the same thing."
status: candidate
source:
  doc_path: "D:/GitHub/Research-Acquisition/yt-bulk-subtitles-downloader/subtitles/Gary Habermas/Gary Habermas - Chapter 100 - Q & A with Gary Habermas & Mike Licona.md"
  speaker: "Gary Habermas"
  timestamp: "~00:04:00"
  fingerprint: "groups of people simultaneously experienced had an experience they interpreted as the Risen Jesus appearing to them"
criteria:
  - Multiple people present at the same time.
  - They interpreted the experience as the risen Jesus appearing to them.
  - The appearances were similar enough that they thought they saw the same thing.
notes:
  - "A 'group' can be as small as two people."
  - "The claim is about the experience, not its cause or veridicality."
