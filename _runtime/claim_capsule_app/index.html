<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claim — Faith Through Physics</title>
<style>
:root{color-scheme:dark;--ink:#f4efe4;--muted:#b9b19f;--panel:#171a20;--line:#343946;--gold:#d9b45b;--ok:#70cf98;--bad:#ec7b72}*{box-sizing:border-box}body{margin:0;background:#0d0f13;color:var(--ink);font:16px/1.45 system-ui,sans-serif}.shell{max-width:980px;margin:auto;padding:32px 20px 80px}h1{font:700 42px Georgia,serif;margin:0}.lede{color:var(--muted);max-width:720px}form,.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;margin-top:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.wide{grid-column:1/-1}label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}input,textarea,select{width:100%;background:#0f1217;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:11px;font:inherit}textarea{min-height:92px;resize:vertical}button{border:0;border-radius:10px;padding:12px 18px;background:var(--gold);color:#17130a;font-weight:800;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.controls{display:flex;gap:12px;align-items:center;margin-top:18px}.note{color:var(--muted);font-size:13px}.stage{border-left:4px solid var(--gold);padding:10px 14px;margin:14px 0;background:#101319}.hash{font:12px ui-monospace,monospace;color:var(--muted);word-break:break-all}.status{font-weight:800;color:var(--ok)}pre{white-space:pre-wrap;word-break:break-word;color:#ddd;font-size:13px}.hidden{display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><main class="shell"><h1>CLAIM</h1><p class="lede">Capture simply. Discover without naming. Classify without promoting. Connect without laundering. Human canonization remains separate.</p>
<form id="claimForm"><div class="grid">
<div class="wide"><label for="claim">What are you claiming?</label><textarea id="claim" required></textarea></div>
<div class="wide"><label for="plain">Plain-language version</label><textarea id="plain" required></textarea></div>
<div><label for="operation">What are you doing?</label><select id="operation"><option value="new_claim">New claim</option><option value="amend">Amend</option><option value="new_version">New version</option><option value="supersede">Supersede</option><option value="add_evidence">Add evidence</option></select></div>
<div><label for="type">Your preliminary kind (Stage 1 will ignore this)</label><select id="type"><option>other</option><option>mathematical</option><option>empirical</option><option>historical</option><option>theological</option><option>bridge</option><option>universal</option><option>normative</option><option>everyday_translation</option></select></div>
<div class="wide"><label for="defeat">What would defeat or narrow it?</label><textarea id="defeat" required></textarea></div>
<div><label for="evidence">Present evidence (one per line)</label><textarea id="evidence"></textarea></div><div><label for="open">What remains open? (one per line)</label><textarea id="open"></textarea></div>
</div><div class="controls"><button id="run" type="submit">Run three-stage review</button><label><input id="mock" type="checkbox" style="width:auto"> Test machinery without DeepSeek</label></div><p class="note">Closing or reviewing never promotes this record into canon.</p></form>
<section id="result" class="result hidden"><div id="summary"></div><div id="stages"></div></section></main>
<script>
const lines=id=>document.getElementById(id).value.split(/\n/).map(x=>x.trim()).filter(Boolean);
document.getElementById('claimForm').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('run');b.disabled=true;b.textContent='Reviewing…';const payload={schema_version:'claim-capsule/1.0.0',operation:operation.value,claim:claim.value.trim(),plain_language:plain.value.trim(),claim_type:type.value,defeat_condition:defeat.value.trim(),present_evidence:lines('evidence'),open_items:lines('open'),decision:{selected_by:'human',confirmed_by_human:true},lifecycle:'staged',canonical_promotion_requested:false,provider:document.getElementById('mock').checked?'mock':'deepseek'};try{const r=await fetch('/api/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await r.json();if(!r.ok)throw Error(data.error||'Review failed');result.classList.remove('hidden');summary.innerHTML=`<div class="status">${data.final_status}</div><div class="hash">${data.run_id}<br>${data.receipt_path}</div>`;stages.innerHTML=data.stages.map(s=>`<article class="stage"><strong>${s.name.toUpperCase()} — ${s.status}</strong><div class="hash">${s.hash}</div><details><summary>Open full output</summary><pre>${escapeHtml(JSON.stringify(s.output,null,2))}</pre></details></article>`).join('');}catch(err){result.classList.remove('hidden');summary.innerHTML=`<div style="color:var(--bad)">BLOCKED — ${escapeHtml(err.message)}</div>`;stages.innerHTML='';}finally{b.disabled=false;b.textContent='Run three-stage review';}});
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
