  term: Law 1 - Newton-Grace (Gravitation -> Grace)
  plain: 'Gravity always pulls and never pushes, but whether you orbit or crash depends
    on what you bring. Bring angular momentum and you hold a stable orbit - close
    enough to be warmed, far enough to remain yourself. Bring nothing and you fall
    straight in. The proposed reading: grace always draws, and relationship needs
    your response to keep it from collapsing into sameness. The physics is established;
    the grace mapping is proposed, not proven - it remains an open structural analogy,
    not a demonstrated identity.'
