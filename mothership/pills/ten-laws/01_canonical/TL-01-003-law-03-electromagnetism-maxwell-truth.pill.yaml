  term: Law 3 - Maxwell-Truth (Electromagnetism / Truth)
  plain: 'Light is the signal that loses nothing in transmission - Maxwell''s equations
    are complete, no loose ends. The proposal: truth propagates the same way, perfect
    at the source, with the loss always at the receiving end. The bolder piece - that
    the truth operator has the seven I AM statements as its eigenmodes - is recorded
    in canon as a well-posed conjecture, not a result. The physics is established;
    the truth mapping and the eigenmode program remain open and unproven.'
