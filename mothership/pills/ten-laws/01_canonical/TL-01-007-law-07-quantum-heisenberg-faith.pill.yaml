  name: Law 7 - Heisenberg-Faith (Quantum / Faith)
  term: Law 7 - Heisenberg-Faith (Quantum / Faith)
  plain: 'Quantum systems hold all possibilities until engagement collapses them into
    one. The proposal: faith is that kind of engagement - not passive uncertainty
    but the commitment that actualizes. Canon is blunt about the state of play: the
    collapse threshold is a proposed protocol, not a prediction; the old threshold
    numbers are retired; and the math of how faith enters the amplitude broke once
    already and remains open pending a repair ruling. The physics is established;
    the faith mapping is partial and not proven.'
  status: proposed
