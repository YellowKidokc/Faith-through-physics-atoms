    S02 — Axiom/Definition Spine: This section isolates the foundational definitions
      and axioms on which the paper's quantitative test rests. These are the primitives
      that must be accepted (or contested) before the simulation results can be evaluated.
    Axioms: '**A1 — Testability of the Standard Mechanism**

      The standard evolutionary mechanism (random mutation, natural selection, genetic
      drift) is a quantitative hypothesis: given published parameter ranges for mutation
      rates, selection coefficients, effective population sizes, and generation times,
      it predicts a distribution of possible trajectories over 1.8 billion years.
      This hypothesis can be tested by simulation.


      > *Source anchor:* "This model is testable. Given published parameter ranges
      for mutation rates, selection coefficients, effective population sizes, and
      generation times, one can ask: does the mechanism, initialized under favorable
      assumptions and run forward for 1.8 billion years, produce output consistent
      with the observed endpoint?"


      **A2 — Published Parameter Ranges Are Binding**

      The mechanism must operate within its own published parameter ranges. Parameters
      outside physically plausible ranges (as documented in the literature) do not
      count as the standard mechanism.


      > *Source anchor:* "Parameter ranges are drawn from published literature without
      adjustment."


      **A3 — Falsification Conditions Are Stated in Advance**

      The test is falsifiable: if P(simultaneous viability) > 0.50 for Config 1, or
      if any configuration closes the diversification gap, the mechanism is adequate
      for that configuration''s assumptions.


      > *Source anchor:* "Stated before any simulation runs: If P(simultaneous viability)
      > 0.50 for Config 1 → the simultaneous viability argument is weakened. If any
      configuration produces a trajectory closing the diversification gap → the mechanism
      is adequate for that configuration''s assumptions."'
    Definitions: '**D1 — Simultaneous Viability**

      Both prey and predator populations must exceed their respective minimum viable
      population (MVP) thresholds simultaneously within 100 generations.


      - Prey MVP: 500

      - Predator MVP: 50


      > *Source anchor:* "Simultaneous viability criterion: Both prey AND predator
      populations must exceed their respective MVPs simultaneously within 100 generations."


      **D2 — Coordination Waiting Time (Lynch & Abegg 2010)**

      The waiting time for N coordinated mutations is given by:


      | N | Waiting Time (generations) |

      |---|----------------------------|

      | 1 | T ≈ 1/(N_e · μ) |

      | 2 | T ≈ 1/(N_e · μ²) |

      | ≥3 | T ≈ 1/(N_e · μ^N) |


      > *Source anchor:* "Coordination waiting time: Lynch & Abegg (2010) formula
      for N coordinated mutations: N = 1: T ≈ 1/(N_e · μ) — feasible; N = 2: T ≈ 1/(N_e
      · μ²) — marginally feasible; N ≥ 3: T ≈ 1/(N_e · μ^N) — infeasible under standard
      parameters."


      **D3 — Available Evolutionary Timeline**

      The available timeline is 1.8 × 10⁹ years divided by 25 years per generation,
      yielding approximately 7.2 × 10⁷ generations. This is described as the most
      favorable estimate; actual effective generation time averaged across all eukaryotes
      is likely longer.


      > *Source anchor:* "Available timeline: 1.8 × 10⁹ years / 25 years per generation
      ≈ 7.2 × 10⁷ generations (using the most favorable estimate; actual effective
      generation time averaged across all eukaryotes is likely longer)."


      **D4 — Haldane Fixation Budget**

      The number of available fixation events is the number of generations divided
      by 300 (Haldane''s cost of selection). For the human lineage: 280,000 / 300
      ≈ 933 fixation events.


      > *Source anchor:* "Haldane fixation budget: Available fixation events: 280,000
      / 300 ≈ 933."


      **D5 — Diversification Gap**

      The gap between what the standard mechanism can produce under published parameters
      and the observed endpoint of eukaryotic diversification (≈8.7 million species,
      35 animal phyla, ≈1,400 protein folds, ≈16,000 gene families, ≥705 coordinated
      innovation packages).


      > *Source anchor:* "approximately 8.7 million species (Mora et al., 2011), 35
      animal phyla, approximately 1,400 unique protein folds (SCOP database), approximately
      16,000 unique gene families (Pfam), and at least 705 coordinated innovation
      packages (Davidson & Erwin, 2006) requiring multi-locus genetic coordination."'
