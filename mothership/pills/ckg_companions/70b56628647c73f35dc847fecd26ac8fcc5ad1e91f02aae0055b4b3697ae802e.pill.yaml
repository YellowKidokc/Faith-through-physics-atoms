    9.1 Open Questions: 'The paper''s conclusion — that the standard evolutionary
      mechanism is quantitatively insufficient under its own published parameters
      — rests on several assumptions that are not fully resolved. The following open
      questions identify where further work is needed.


      #### Q1 — The Coordination Requirement (N)


      **Question:** For specific evolutionary innovations (body plan kernels, novel
      organ systems, new cell types), what is the minimum number of coordinated genetic
      changes required?


      **Why it matters:** The paper''s strongest quantitative argument (Configs 2–5)
      depends on the assumption that many innovations require N ≥ 3 coordinated mutations.
      If most innovations can be decomposed into sequences of N = 1 steps, the Lynch
      & Abegg constraint does not apply, and the mechanism may be adequate.


      **Current state:** The paper cites Davidson & Erwin (2006) for the claim that
      body plan innovations require N ≥ 3. This is contested in evolutionary developmental
      biology. Some researchers argue that regulatory changes can be gradual; others
      argue that GRN kernels are highly constrained.


      **What would resolve it:** A systematic empirical assessment of N for specific
      innovations, with measured fitness effects at each intermediate step. The paper
      explicitly invites such work: "If developmental genetics can demonstrate that
      N = 1 pathways exist for these transitions, the coordination problem dissolves."


      **Falsification condition:** If N = 1 pathways are demonstrated for the majority
      of the 705 coordinated innovation packages, the paper''s coordination argument
      is substantially weakened.


      #### Q2 — Multi-Locus Selection Effects


      **Question:** Can epistasis, selective sweeps, or recombination reduce the effective
      waiting time for coordinated changes by 12+ orders of magnitude, bringing N
      = 3 transitions within the available timeline?


      **Why it matters:** The Lynch & Abegg framework assumes that coordinated mutations
      must arise simultaneously or in rapid succession, with no epistasis. If multi-locus
      effects substantially reduce the waiting time, the constraint may be relaxed.


      **Current state:** The paper does not cite any quantitative treatment showing
      such a reduction. It explicitly requests one: "If a published quantitative treatment
      demonstrates a reduction of 12+ orders of magnitude — sufficient to bring N
      = 3 transitions within the available timeline — we would welcome the citation."


      **What would resolve it:** A published quantitative model incorporating epistasis,
      selective sweeps, and recombination that demonstrates a 12+ order reduction
      in waiting time for N = 3 transitions under published parameter ranges.


      **Falsification condition:** If such a model is published and validated, the
      paper''s coordination argument is substantially weakened.


      #### Q3 — Model Dependence


      **Question:** Do alternative population dynamics models (e.g., with spatial
      structure, Allee effects, frequency-dependent selection, or adaptive dynamics)
      produce significantly higher viability probabilities than the standard Lotka-Volterra
      model?


      **Why it matters:** The Config 1 result (P(viability) = 0.0667) depends on the
      Lotka-Volterra framework. If a more realistic model yields higher viability,
      the Config 1 argument weakens.


      **Current state:** The paper uses standard Lotka-Volterra without modification
      and acknowledges that alternative models are not tested. The sensitivity analysis
      addresses parameter uncertainty but not model uncertainty.


      **What would resolve it:** Simulation studies using alternative model structures
      under the same published parameter ranges. The paper''s code is available for
      such tests.


      **Falsification condition:** If a plausible alternative model produces P(viability)
      > 0.50 for Config 1, the simultaneous viability argument is weakened.


      #### Q4 — Entropy and Complexity


      **Question:** Does the entropy analysis provide rigorous evidence against self-organization,
      or is it a qualitative observation?


      **Why it matters:** The paper claims that entropy decreases are driven by extinction,
      not self-organization, and that "both entropy and complexity decrease together."
      However, the paper does not provide a formal definition of complexity or a quantitative
      measure of its change.


      **Current state:** The entropy analysis is based on 50 trials and uses a qualitative
      notion of complexity. It is the weakest link in the paper''s evidence chain.


      **What would resolve it:** A formal definition of complexity (e.g., network
      connectivity, functional diversity) and a quantitative measure of its change
      alongside entropy. If complexity is shown to increase while entropy decreases
      in some trials, the interpretation would need revision.


      **Falsification condition:** If a rigorous measure shows complexity increasing
      while entropy decreases in a significant fraction of trials, the claim that
      entropy decreases indicate degradation is weakened.


      #### Q5 — Cross-Domain Translation


      **Question:** Does the scientific finding that the standard mechanism is quantitatively
      insufficient warrant any particular theological or philosophical conclusion?


      **Why it matters:** The paper is part of the Theophysics project, and its conclusion
      has been translated into theological terms (S06). The translation is speculative
      and not entailed by the science.


      **Current state:** The paper itself does not make theological claims. It states
      that an additional organizational principle may be required, but does not specify
      what that principle is. The theological translation is a separate layer of interpretation.


      **What would resolve it:** Independent philosophical analysis of the implications
      of the scientific finding, distinguishing between what is entailed and what
      is compatible. The scientific claims stand or fall on their own merits.


      **Falsification condition:** The cross-domain translation is not a scientific
      claim and cannot be falsified by empirical evidence. It should be held tentatively
      and not presented as a direct implication of the data.


      #### Q6 — The Cambrian Explosion


      **Question:** Can the Lynch & Abegg framework be reconciled with the observed
      tempo of the Cambrian explosion (20 million years, 35+ animal phyla)?


      **Why it matters:** The Cambrian explosion is often cited as evidence that rapid
      diversification is possible. If the mechanism can produce the Cambrian explosion,
      it might be able to produce the broader pattern.


      **Current state:** The paper explicitly mentions the Cambrian explosion in Section
      7, noting that a formal reconciliation would be a significant contribution.
      It does not claim to have resolved this.


      **What would resolve it:** A quantitative model showing how the Cambrian explosion
      could occur within the Lynch & Abegg framework, or an explicit statement that
      it cannot.


      **Falsification condition:** If a quantitative reconciliation is achieved, the
      paper''s coordination argument is weakened for the Cambrian period. If it is
      not, the field needs to address the discrepancy.'
