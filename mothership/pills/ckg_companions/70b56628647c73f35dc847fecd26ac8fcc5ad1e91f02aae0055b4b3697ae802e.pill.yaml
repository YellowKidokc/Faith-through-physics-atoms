    10.1 Consilience of Evidence: 'The paper''s central claim — that the standard
      evolutionary mechanism is quantitatively insufficient under its own published
      parameters — is supported by three independent lines of evidence:


      1. **Population dynamics (Config 1):** Monte Carlo simulation of Lotka-Volterra
      dynamics shows that random co-initialization produces simultaneous viability
      in only 6.67% of trials. The bottleneck is prey survival: prey are consumed
      before establishing a viable population in 89.8% of trials. This result is robust
      across 100,000 trials, seed-independent, and stable under parameter sweeps.


      2. **Coordination waiting times (Configs 2–5):** The Lynch & Abegg (2010) framework
      shows that innovations requiring N ≥ 3 coordinated mutations have waiting times
      exceeding the available timeline by 10¹² to 10²⁸ orders of magnitude. This constraint
      applies even when starting from the complete endpoint (Config 2), from class-level
      representatives (Config 3), from phylum-level representatives (Config 4), and
      for the human lineage under maximum concession parameters (Config 5).


      3. **Fixation budget (Config 5):** The Haldane fixation budget for the human
      lineage allows approximately 933 fixation events, while the required functional
      changes are estimated at ~1,400,000 — a ratio of 1,500:1. The inverse solver
      shows that three of seven parameters required for the mechanism to work are
      outside physically plausible ranges.


      These three lines of evidence converge on the same conclusion: the standard
      mechanism, operating within its own published parameter ranges, cannot produce
      the observed pattern of eukaryotic diversification.'
