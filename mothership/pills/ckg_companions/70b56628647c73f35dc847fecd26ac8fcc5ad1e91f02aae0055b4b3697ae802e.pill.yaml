      If developmental genetics can demonstrate that N = 1 pathways exist for these
      transitions, the coordination problem dissolves. If N ≥ 3 is genuinely required,
      the waiting time constraint is binding.


      #### 10.4.2 Quantitative Treatment of Multi-Locus Effects


      The paper requests a published quantitative treatment showing that epistasis,
