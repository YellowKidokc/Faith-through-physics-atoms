      Independent replication by researchers without a stake in the Theophysics project
      would strengthen confidence in the results.


      #### 10.4.5 Formal Definition of Complexity


      The entropy analysis would benefit from a formal definition of complexity and
      a quantitative measure of its change alongside entropy. If complexity is shown
      to increase while entropy decreases in some trials, the degradation interpretation
      would need revision.'
