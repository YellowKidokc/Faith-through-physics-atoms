    7.6 Mathematical Limitations and Open Questions: '1. **Model dependence:** The
      Lotka-Volterra model is one of many possible population dynamics models. Alternative
      models (e.g., with spatial structure, Allee effects, or adaptive dynamics) could
      yield different results.


      2. **Parameter uncertainty:** The parameter ranges are drawn from published
      literature, but some ranges are wide. The paper''s sensitivity analysis addresses
      this for Config 1 but not for all configurations.


      3. **Coordination requirement (N):** The value of N for specific innovations
      is a biological question, not a mathematical one. The paper assumes N ≥ 3 for
      body plan innovations based on Davidson & Erwin (2006). If this assumption is
      wrong, the waiting-time constraint weakens.


      4. **Multi-locus effects:** The Lynch & Abegg framework does not include epistasis,
      selective sweeps, or recombination. If these effects reduce the effective waiting
