    '7.1 Population Dynamics: Lotka-Volterra Equations': 'The paper uses the standard
      Lotka-Volterra predator-prey model without modification:


      $$

      \frac{dN_{\text{prey}}}{dt} = r_1 N_{\text{prey}} - \alpha N_{\text{prey}} N_{\text{pred}}

      $$


      $$

      \frac{dN_{\text{pred}}}{dt} = \beta N_{\text{prey}} N_{\text{pred}} - \delta
      N_{\text{pred}}

      $$


      **Parameters (drawn uniformly per trial from published ranges):**


      | Symbol | Description | Range |

      |--------|-------------|-------|

      | $r_1$ | Prey growth rate | [0.05, 0.4] per generation |

      | $\alpha$ | Predation rate | [0.001, 0.05] per interaction |

      | $\beta$ | Predator efficiency | Derived from $\alpha$ |

      | $\delta$ | Predator death rate | [0.02, 0.2] per generation |

      | $N_{\text{prey}}(0)$ | Initial prey population | [10, 2000] |

      | $N_{\text{pred}}(0)$ | Initial predator population | [2, 200] |


      **Minimum viable population (MVP) thresholds:**


      - Prey MVP: 500

      - Predator MVP: 50


      **Simultaneous viability criterion:** Both $N_{\text{prey}} > 500$ and $N_{\text{pred}}
      > 50$ must hold simultaneously within 100 generations.


      **Source anchor:** "Standard Lotka-Volterra predator-prey with stochastic initialization...
      Parameters drawn uniformly per trial from published ranges..."


      **Assessment:** The Lotka-Volterra model is a standard, well-understood framework.
      Its limitations are well-known: it assumes homogeneous mixing, continuous populations,
      and constant parameters. The paper''s use of published parameter ranges is appropriate,
      but the model does not include spatial structure, age structure, or frequency-dependent
      selection. These omissions are acknowledged in the paper''s sensitivity analysis
      (Section 3.1) but not fully explored.'
    '7.2 Coordination Waiting Time: Lynch & Abegg (2010)': 'The waiting time for N
      coordinated mutations is given by:


      | N | Waiting Time (generations) |

      |---|----------------------------|

      | 1 | $T \approx \frac{1}{N_e \mu}$ |

      | 2 | $T \approx \frac{1}{N_e \mu^2}$ |

      | ≥3 | $T \approx \frac{1}{N_e \mu^N}$ |


      **Parameter values used:**


      - Effective population size $N_e$: 10,000 (standard estimate for vertebrates)

      - Mutation rate $\mu$: $1.1 \times 10^{-8}$ per bp per generation (Nachman &
      Crowell, 2000)


      **Derived waiting times:**


      | N | Waiting Time (generations) | Available (generations) | Ratio (available
      / waiting) | Feasible? |

      |---|----------------------------|-------------------------|-----------------------------|-----------|

      | 1 | $\sim 10^5$ | $7.2 \times 10^7$ | 720 | YES |

      | 2 | $8.26 \times 10^{11}$ | $7.2 \times 10^7$ | $8.7 \times 10^{-5}$ | NO
      |

      | 3 | $7.51 \times 10^{19}$ | $7.2 \times 10^7$ | $9.6 \times 10^{-13}$ | NO
      |

      | 5 | $6.21 \times 10^{35}$ | $7.2 \times 10^7$ | $1.2 \times 10^{-28}$ | NO
      |


      **Source anchor:** "Lynch & Abegg (2010) formula for N coordinated mutations:
      N = 1: T ≈ 1/(N_e · μ) — feasible; N = 2: T ≈ 1/(N_e · μ²) — marginally feasible;
      N ≥ 3: T ≈ 1/(N_e · μ^N) — infeasible under standard parameters."


      **Assessment:** The Lynch & Abegg framework is a standard quantitative treatment
      of complex adaptation. Its key assumption is that N mutations must arise in
      a coordinated fashion (simultaneously or in rapid succession) to produce a functional
      innovation. If this assumption is relaxed — e.g., if intermediate genotypes
      have fitness advantages — the waiting time can be reduced. The paper acknowledges
      this in Objection O1 and O2. The mathematical form $T \propto \mu^{-N}$ is correct
      for the simultaneous-mutation model; the question is whether the model applies
      to the innovations in question.'
    7.3 Haldane Fixation Budget: 'The number of available fixation events is:


      $$

      \text{Fixation events} = \frac{\text{Generations}}{300}

      $$


      For the human lineage:


      - Available generations: 280,000

      - Fixation events: $280,000 / 300 \approx 933$


      **Required functional changes (human lineage only):** ~1,400,000


      **Ratio:** $1,400,000 / 933 \approx 1,500:1$


      **Source anchor:** "Haldane fixation budget: Available fixation events: 280,000
      / 300 ≈ 933."


      **Assessment:** Haldane''s cost of selection (1957) is a classical result: each
      substitution imposes a fitness cost, and the total cost limits the number of
      substitutions. The factor 300 is a standard estimate of the cost per substitution.
      The paper''s calculation is straightforward. The key uncertainty is the estimate
      of required functional changes (~1.4 million), which depends on assumptions
      about the functional genome fraction and the number of adaptive substitutions.
      The paper uses the ENCODE 2012 lower bound of 8% functional genome, which is
      conservative.'
    7.4 Entropy Calculation: 'The paper computes entropy changes in the population
      dynamics simulation:


      $$

      \Delta H = H_{\text{final}} - H_{\text{initial}}

      $$


      where $H$ is the Shannon entropy of the species abundance distribution:


      $$

      H = -\sum_i p_i \ln p_i

      $$


      with $p_i$ the relative abundance of species $i$.


      **Results:**


      - 90% of trials show net entropy decrease

      - Mean net $\Delta H$: $-0.2076$ nats

      - Median survival time: 8.2 generations


      **Source anchor:** "Mean net ΔH: −0.2076 nats" and "Median survival time: 8.2
      generations"


      **Assessment:** The entropy calculation is mathematically standard. The interpretation
      — that entropy decreases are driven by extinction, not self-organization — is
      supported by the fact that both entropy and complexity decrease together. However,
      the paper does not provide a formal definition of complexity, so the claim that
      "both decrease together" is qualitative. A more rigorous treatment would define
      complexity operationally (e.g., via network connectivity or functional diversity)
      and measure it alongside entropy.'
    7.5 The Five Configurations as Mathematical Tests: 'Each configuration can be
      expressed as a set of initial conditions and constraints:


      | Config | Initial Conditions | Constraint Tested | Mathematical Form |

      |--------|-------------------|-------------------|-------------------|

      | 1 | Random $N_{\text{prey}}, N_{\text{pred}}$ | Simultaneous viability | $P(N_{\text{prey}}
      > 500 \land N_{\text{pred}} > 50 \text{ within 100 gen})$ |

      | 2 | All species at viable levels | Coordination waiting time | $T(N) < 7.2
      \times 10^7$ for all required innovations |

      | 3 | 50 classes at viable levels | Class-level transitions | $50 \times T(3)
      < 7.2 \times 10^7$ |

      | 4 | 35 phyla at viable levels | Phylum origin | $T(5) < 7.2 \times 10^7$ for
      each phylum |

      | 5 | Human lineage, max concession | Haldane budget | $1.4 \times 10^6 < 933$
      |


      **Assessment:** The mathematical formulation of each configuration is clear
      and testable. The results are negative for all configurations. The strength
