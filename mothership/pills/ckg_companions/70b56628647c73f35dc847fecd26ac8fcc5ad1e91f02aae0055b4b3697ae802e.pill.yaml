    10.4 Next Steps: 'The paper identifies several concrete next steps for empirical
      and theoretical work:


      #### 10.4.1 Empirical Assessment of Coordination Requirements (N)


      The most critical open question is the value of N for specific evolutionary
      innovations. The paper calls for a systematic empirical assessment:


      > "For each major transition in the fossil record — the origin of each animal
      phylum, the origin of multicellularity, the origin of the vertebrate body plan
