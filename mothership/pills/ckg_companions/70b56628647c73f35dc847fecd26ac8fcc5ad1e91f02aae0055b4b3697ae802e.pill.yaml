    One-Sentence Claim: '> The standard evolutionary mechanism — random mutation,
      natural selection, and genetic drift — fails to close the eukaryotic diversification
      gap under any of five independent initialization configurations tested, even
      when granted progressively more generous starting assumptions.'
    Core Finding: 'This paper presents a quantitative stress test of the materialist
      diversification mechanism. Five simulation configurations are run, each granting
      the mechanism more favorable initial conditions than the last:


      | Config | Initialization | Bottleneck Identified | Verdict |

      |--------|---------------|----------------------|---------|

      | 1 | Random co-initialization of all species | Predator-prey viability | **Fails**
      (P(viability) = 0.0667) |

      | 2 | One of every extant species | Coordination waiting time | **Fails** (11+
      orders of magnitude shortfall for N ≥ 3) |

      | 3 | One per major class (~50) | Class-level transitions | **Fails** (~10¹⁴
      shortfall) |

      | 4 | One per animal phylum (35) | Origin of phyla themselves | **Partially
      succeeds** within phyla; fails for phylum origin |

      | 5 | Human lineage, maximum concession | Haldane fixation budget | **Fails**
      (1,500:1 ratio; 3/7 parameters implausible) |


      The bottleneck shifts between configurations — from ecological viability in
      Config 1 to coordination waiting time in Configs 2–5 — but no configuration
      produces a trajectory consistent with the observed endpoint of eukaryotic diversification.'
    Key Quantitative Anchors: '- **Config 1:** P(simultaneous viability) = 0.0667
      ± 0.0029 across 100,000 Monte Carlo trials. Prey are consumed before establishing
      a viable population in 89.8% of trials.

      - **Config 2:** Waiting time for N = 3 coordinated mutations is 7.51 × 10¹⁹
      generations vs. 7.2 × 10⁷ available — a 10¹²× shortfall.

      - **Config 3:** 50 class-level transitions at N = 3 require ~3.76 × 10²¹ generations
      — a ~10¹⁴ shortfall.

      - **Config 5:** Required functional changes (~1,400,000) exceed the Haldane
      fixation budget (933) by a ratio of 1,500:1.'
    Interpretation: The paper does not claim to disprove evolution or common descent.
      It claims that the *standard mechanism* — random mutation, natural selection,
      and genetic drift — is quantitatively insufficient under its own published parameter
      ranges to account for the observed tempo and mode of eukaryotic diversification.
      The entropy analysis further shows that observed entropy decreases are driven
      by population collapse, not self-organization.
