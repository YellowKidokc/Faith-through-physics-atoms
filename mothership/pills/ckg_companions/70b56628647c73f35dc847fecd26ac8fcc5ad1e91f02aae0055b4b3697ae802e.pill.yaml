    The Master Argument: '**P1 (Testability).** The standard evolutionary mechanism
      is a quantitative hypothesis: given published parameter ranges for mutation
      rates, selection coefficients, effective population sizes, and generation times,
      it predicts a distribution of possible trajectories over ~1.8 billion years.


      > *Source anchor:* "This model is testable. Given published parameter ranges...
      one can ask: does the mechanism, initialized under favorable assumptions and
      run forward for 1.8 billion years, produce output consistent with the observed
      endpoint?"


      **P2 (Binding Parameters).** The mechanism must operate within its own published
      parameter ranges. Parameters outside physically plausible ranges do not count
      as the standard mechanism.


      > *Source anchor:* "Parameter ranges are drawn from published literature without
      adjustment."


      **P3 (Falsification Conditions).** The test is falsifiable: if P(simultaneous
      viability) > 0.50 for Config 1, or if any configuration closes the diversification
      gap, the mechanism is adequate for that configuration''s assumptions.


      > *Source anchor:* "Stated before any simulation runs: If P(simultaneous viability)
      > 0.50 for Config 1 → the simultaneous viability argument is weakened. If any
      configuration produces a trajectory closing the diversification gap → the mechanism
      is adequate for that configuration''s assumptions."


      **P4 (Five Configurations).** Five configurations are tested, each granting
      the mechanism progressively more generous starting assumptions:


      | Config | Initialization | What It Tests |

      |--------|---------------|---------------|

      | 1 | Random co-initialization of all species | Can the ecosystem self-assemble
      from random initial conditions? |

      | 2 | One of every extant species, established | Given the endpoint as the starting
      point, is it simultaneously viable? |

      | 3 | One per major biological class (~50), established | Can class-level diversification
      produce the observed pattern? |

      | 4 | One per animal phylum (35), established | Can phylum-level diversification
      produce the observed pattern? |

      | 5 | Human lineage, maximum concession parameters | Can the best-documented
      lineage close under optimal conditions? |


      > *Source anchor:* Table in Section 2.2.


      **P5 (Config 1 Result).** Random co-initialization produces viable ecosystems
      less than 7% of the time under standard parameters.


      - P(simultaneous viability) = 0.0667 ± 0.0029 across 100,000 Monte Carlo trials.

      - Prey are consumed before establishing a viable population in 89.8% of trials.

      - The bottleneck is prey survival, not predator survival (predators survive
      97.9% of the time).


      > *Source anchor:* "Result: P(simultaneous viability) = 0.0667 ± 0.0029" and
      "Prey survival. Predators survive 97.9% of the time, but prey are consumed before
      establishing a viable population in 89.8% of trials."


      **P6 (Config 2 Result).** Even starting from the complete endpoint, the waiting
      times for coordinated innovations exceed the available timeline by 11+ orders
      of magnitude for N ≥ 3.


      - N = 2: 8.26 × 10¹¹ generations vs. 7.2 × 10⁷ available (10⁴× shortfall).

      - N = 3: 7.51 × 10¹⁹ generations vs. 7.2 × 10⁷ available (10¹²× shortfall).

      - N = 5: 6.21 × 10³⁵ generations vs. 7.2 × 10⁷ available (10²⁸× shortfall).

      - Required coordinated innovation packages: 705 (Davidson & Erwin, 2006), most
      requiring N ≥ 3.


      > *Source anchor:* "Even starting from the complete endpoint, the waiting times
      for coordinated innovations exceed the available timeline by 11+ orders of magnitude
      for N ≥ 3."


      **P7 (Config 3 Result).** The class-level transitions cannot be completed in
      the available time.


      - 50 class-level transitions at N = 3 require ~3.76 × 10²¹ generations.

      - Available: 7.2 × 10⁷ generations.

      - Shortfall: ~10¹⁴.


      > *Source anchor:* "The class-level transitions cannot be completed in the available
      time."


      **P8 (Config 4 Result).** The mechanism partially succeeds within phyla but
      cannot account for the origin of the phyla themselves.


      - Within-phylum diversification is largely feasible for N ≤ 2 transitions.

      - The origin of the 35 phyla from a common ancestor requires N ≥ 5 coordinated
      innovations per body plan (Davidson, 2006), which returns to the Lynch & Abegg
      constraint.


      > *Source anchor:* "Mechanism partially succeeds within phyla but cannot account
      for the origin of the phyla themselves."


      **P9 (Config 5 Result).** The mechanism fails for the best-documented lineage
      under the most favorable assumptions.


      - Required functional changes (~1,400,000) exceed the Haldane fixation budget
      (933) by a ratio of 1,500:1.

      - Three out of seven parameters required for the mechanism to work are outside
      physically plausible ranges.


      > *Source anchor:* "Mechanism fails for the best-documented lineage under the
      most favorable assumptions." and "Three out of seven parameters outside physically
      plausible ranges."


      **P10 (Entropy Analysis).** The observed net entropy decrease is not evidence
      of self-organization; it is the system simplifying through death.


      - 90% of trials show net entropy decrease.

      - All net decreases are driven by population collapse (species extinction).

      - Mean net ΔH: −0.2076 nats; median survival time: 8.2 generations.

      - Both entropy and complexity decrease together, indicating degradation.


      > *Source anchor:* "The entropy decrease is NOT evidence of self-organization.
      It is the system simplifying through death."


      **P11 (Coordination Constraint).** The mechanism can produce single-mutation
      adaptations comfortably. It cannot produce coordinated multi-locus innovations
      requiring N ≥ 3 within any configuration''s timeline.


      > *Source anchor:* "The mechanism can produce single-mutation adaptations comfortably.
      It cannot produce coordinated multi-locus innovations requiring N ≥ 3 within
      any configuration''s timeline."


      **P12 (No Configuration Closes the Gap).** No configuration produced a trajectory
      consistent with the observed pattern of eukaryotic diversification.


      - The bottleneck shifts between configurations: predator-prey viability in Config
      1, coordination waiting time in Configs 2–5.

      - In every case, the mechanism falls short — by factors ranging from 15× (Config
      1 viability) to 10²⁸× (Config 5 coordination for N = 5).


      > *Source anchor:* "No configuration produced a trajectory consistent with the
      observed pattern of eukaryotic diversification."


      **C (Conclusion).** The standard evolutionary mechanism — random mutation, natural
      selection, and genetic drift — is quantitatively insufficient under its own
      published parameter ranges to account for the observed tempo and mode of eukaryotic
      diversification. An additional organizational principle beyond random mutation
      and natural selection may be required.


      > *Source anchor:* "an additional organizational principle — beyond random mutation
      and natural selection — is required to account for the observed tempo and mode
      of eukaryotic evolution."'
    Inference Structure: 'The argument has the form of a **constructive dilemma**
      across configurations:


      1. If the mechanism is adequate, then at least one configuration should close
      the diversification gap (P3).

      2. No configuration closes the gap (P5–P9, P12).

      3. Therefore, the mechanism is not adequate under any tested configuration (C).


      The argument is **modus tollens** applied to the mechanism''s own predictions:


      - If the mechanism is sufficient, then P(viability) > 0.50 for Config 1 and
      waiting times are within the timeline for Configs 2–5.

      - P(viability) = 0.0667 for Config 1 and waiting times exceed the timeline by
      10⁴–10²⁸× for Configs 2–5.

      - Therefore, the mechanism is not sufficient.'
    The Role of the Entropy Analysis: 'The entropy analysis (P10) is a **subsidiary
      argument** that blocks a potential escape route: the claim that observed entropy
      decreases in biological systems demonstrate self-organization. The paper shows
      that in its simulations, entropy decreases are driven by extinction, not by
      the emergence of new organized structure. This does not by itself prove that
      no self-organization occurs in nature, but it removes a common line of evidence
      for it.'
    The Role of the Falsification Conditions: 'The falsification conditions (P3) are
      stated before the simulations run. This is a **methodological commitment** that
      strengthens the argument: the authors cannot be accused of post hoc threshold-setting.
      The conditions also define what would count as a successful configuration, making
      the argument''s failure conditions explicit.'
