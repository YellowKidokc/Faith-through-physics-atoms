      reported fit (R² = 0.888) is plausible for a monotone declining dataset.


      **Dimensional coherence:** The equation is dimensionally consistent if t is
      measured in generations and τ_d in generations. However, the document reports
      τ_d ≈ 214 **years**, while t is a **generational index** (dimensionless). This
      is a **dimensional inconsistency**: the time constant should be expressed in
      the same units as the independent variable. If t is a generation count, τ_d
      should be in generations (≈ 214 years / ~30 years per generation ≈ 7 generations).
      The document conflates years and generations.


      **Inferential licensing:** The equation describes a curve, not a mechanism.
      Fitting an exponential curve to data does not establish that the underlying
      process is entropic decoherence. Many processes produce exponential-like decay
      (radioactive decay, population decline, memory retention, etc.). The inference
      from "fits an exponential" to "is entropic decoherence" requires an additional
      premise (HP002) that the exponential form is uniquely diagnostic of entropic
      decoherence.


