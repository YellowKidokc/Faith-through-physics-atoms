    6. Adversarial Destruction: '- **test:** Countermodel: Consider a universe with
      no physical entropy but with moral agents making choices. If morality is physics
      and sin is entropy, then in a zero-entropy universe, no sin could occur, yet
      moral agents could still choose wrongly.; **target:** C002; **result:** FAILED;
      **finding:** The identity claim fails because sin can exist without entropy
      increase, e.g., a perfectly ordered system with a wrong choice.

      - **test:** Premise denial: Deny that morality is reducible to physics. If moral
      facts are not physical facts, then the identity claim is false.; **target:**
      C001; **result:** FAILED; **finding:** The claim is unsupported and likely false
      under standard non-reductive moral realism.

      - **test:** Ablation: Remove the hidden premise that ''is'' denotes identity.
      If ''is'' is merely metaphorical, the claims become analogies, not identities.;
      **target:** C001, C002; **result:** CONDITIONAL; **finding:** If interpreted
      as analogy, the claims are trivially true but lose their force; if identity,
      they are unsupported.

      - **test:** Role permutation: Swap ''morality'' and ''physics'' in C001. If
      morality is physics, then physics is morality. But physics is not normative;
      it does not prescribe how we ought to act.; **target:** C001; **result:** FAILED;
      **finding:** The symmetry of identity is broken by the normative/descriptive
      distinction.

      - **test:** Rival explanation: The observed phenomena (moral experience, physical
      entropy) are better explained by separate domains with no identity.; **target:**
      C001, C002; **result:** FAILED; **finding:** A simpler account posits two distinct
      domains, avoiding category errors.

      - **test:** Alternative definition: Define ''entropy'' as a measure of disorder
      in a physical system. Sin is a moral concept, not a physical quantity. No mapping
      exists.; **target:** C002; **result:** FAILED; **finding:** The terms are incommensurable
      without a bridge principle.

      - **test:** Edge case: Consider a perfectly ordered system (zero entropy) that
      is morally evil, e.g., a totalitarian regime with perfect order. Sin exists
      without entropy.; **target:** C002; **result:** FAILED; **finding:** Counterexample
      to sin=entropy.

      - **test:** Scope test: The claim is universal (''morality is physics''), but
      it fails for any moral system that is not physical, e.g., divine command theory.;
      **target:** C001; **result:** FAILED; **finding:** The claim is too broad and
      excludes major moral theories.

