      - **Source objects:** C11.

      - **Status:** Anticipated and rebutted.


      #### O5 — The "Ideology" Charge


      > "Either way, refusing to test is not science—it''s ideology."


      - **Objection (as anticipated):** The skeptic may argue that not testing is
