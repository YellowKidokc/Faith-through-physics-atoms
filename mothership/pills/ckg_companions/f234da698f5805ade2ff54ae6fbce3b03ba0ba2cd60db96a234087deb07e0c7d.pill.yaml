    S09 — Open Questions and Falsification Boundaries: '**Open questions:**


      1. **What is the third function?** The source asserts that a third function
      is necessary but does not specify its nature—whether it is physical, mental,
      formal, or relational. This remains the central open question.


      2. **Why do all two-part exits fail?** The source claims that every binary alternative
      fails to terminate the chain of observation, but does not enumerate or prove
      the failure of each possible two-part structure. A complete taxonomy of binary
      exits and their failure modes is needed.


      3. **Is the triadic structure unique?** Could there be a four-part or higher-order
      structure that also terminates the chain? The source does not argue for the
      uniqueness or minimality of the triadic solution.


      4. **How does the triadic structure relate to existing interpretations of quantum
      mechanics?** The source does not engage with Copenhagen, Many-Worlds, de Broglie–Bohm,
      QBism, or relational quantum mechanics. It remains to be shown why these interpretations
      fail to terminate the chain.


      5. **What is the relationship between the measurement problem and the metaphysical
      claim about reality?** The source extends the triadic structure from observation
      to reality itself, but does not justify this leap. The bridge from epistemology
      to ontology is unargued.


      6. **What role does consciousness play?** The domain weights include Consciousness
      (10), but the source does not clarify whether the third function is conscious,
      whether consciousness is necessary for observation, or how the triadic structure
      relates to the observer''s mind.


      7. **What is the formal mathematical structure?** The source provides no equations,
      proofs, or formal definitions. The canonical treatment is said to contain the
      complete argument, tables, and proofs, but these are not present in the interlude.


      **Falsification boundaries:**


      - **Empirical falsification:** The claim that the measurement problem requires
      three functions is not presented with an empirical test. A falsification would
      require an experiment or observation that demonstrates a two-part solution terminating
      the chain. No such test is proposed.


      - **Logical falsification:** The argument could be falsified by exhibiting a
      consistent two-part structure that terminates the chain of observation. The
      source does not rule out this possibility by proof; it asserts it.


      - **Metaphysical falsification:** The claim that reality itself needs a triadic
      structure is a metaphysical assertion that may not be empirically testable.
      Its falsification would require a coherent ontology that is binary and complete,
      which the source does not address.


      - **Interpretive falsification:** If a standard interpretation of quantum mechanics
      (e.g., Copenhagen, Many-Worlds) successfully resolves the measurement problem
      without a triadic structure, the claim would be undermined. The source does
      not engage with these alternatives.


      **Boundary conditions:**


      - The source is explicitly a "short reader-facing interlude" that points to
      a fuller treatment. It does not claim to be self-contained or to provide the
      complete argument.

      - The canonical page **The Watcher Problem — Why Reality Needs Three** is identified
