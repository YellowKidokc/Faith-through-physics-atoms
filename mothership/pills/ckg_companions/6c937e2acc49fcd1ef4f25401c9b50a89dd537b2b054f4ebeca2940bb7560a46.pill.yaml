    Core Finding: The Claim Atom Expansion Canon v0.1 establishes a rigorous methodology
      for decomposing claims into atomic units and expanding them along register-specific
      templates. The central finding is that a claim's strength and meaning can be
      systematically analyzed by opening it into sub-atoms that trace its dependencies,
      evidence, and transmission chain. When two fully opened structures from different
      registers share an invariant signature, an isomorphism candidate is born, which
      must then be graded (IC-0 to IC-5) and gated (WHY_CLOSED, WHY_FAILED, WHY_OPEN).
      The universal grammar is not imposed but emerges bottom-up from all admitted
      atoms, confirmed isomorphisms, and their typed dependency edges.
    One-Sentence Claim: '> **Every claim is an atom; every atom opens along its register
      into sub-atoms; when two opened structures match without names, an isomorphism
      is born, graded, and gated — and the universal grammar is simply everything
      that survives.**


      This one-sentence version encapsulates the entire canon: the atomic unit, the
      expansion rule, the isomorphism discovery process, the grading and gating mechanisms,
      and the emergent nature of the universal grammar.'
    S02 — Axiom/Definition Spine: The Claim Atom Expansion Canon rests on a spine
      of foundational definitions and axioms. These are the primitive commitments
      from which the rest of the methodology is derived. They are stated here in the
      order in which they build upon one another.
    A. The Atomic Unit: '- **C1 — Atom.** The atom is the unit of the corpus: one
      claim record carrying the minimal unified record. One atom = one assertion,
      one hash, one state, one grade.

      - **C3 — Atom identity (A###).** The claim''s immutable identity. Never reused,
      never deleted.

      - **C4 — Layer (L#).** The DG layer the claim operates at — what it depends
      on, what it adds.

      - **C5 — Component (C#).** The decomposed sub-claims of a bundled statement,
      graded separately because components may fail independently.

      - **C2 — Address scheme.** `claims / A042 / L9 / C1` — atom / layer / component.'
    B. Representation and Metadata: '- **C6 — Dual format, one source.** Every component
      exists as `.jsonld` and `.html`, generated deterministically from the same canonical
      object. The projection is never a second truth store.

      - **C7 — Required metadata.** Every atom carries the claim/evidence/proof spine
      plus five axes: lifecycle state, proof class, register, IC grade, WHY-closure
      outcome.'
    C. The Expansion Rule: '- **C8 — Opening.** A claim opens along its register.
      Each register has a native expansion template. Opening an atom produces register-native
      sub-atoms, each itself an atom with its own address.'
    D. Register-Native Templates: '- **C9 — History.** EVENT → POSSIBLE OBSERVERS
      → WITNESS → TESTIMONY → TRANSMISSION → DOCUMENT → PRESERVATION → CORROBORATION
      → INTERPRETATION → PRESENT CLAIM.

      - **C10 — Physics.** QUANTITY → UNITS → DYNAMICS → PROTOCOL → INSTRUMENT → DATA
      → CONTROLS → FIT → CLAIM.

      - **C11 — Math.** DEFINITION → AXIOM USE → LEMMA → DERIVATION → THEOREM STATEMENT
      → RECEIPT.

      - **C12 — Theology.** SOURCE → WITNESS TRADITION → PROCLAMATION → REGISTER →
      CONFESSION CLASS → SCOPE.

      - **C13 — Bridge.** SOURCE REGISTER → TARGET REGISTER → MAPPING → PRESERVED
      → LOST → GRADE → COUNTERMODELS → NEXT TEST.'
    E. The Isomorphism Rule: '- **C14 — Invariant signature.** IDENTITIES · DISTINCTIONS
      · RELATIONS · OPERATIONS · DEPENDENCIES · CONSTRAINTS · INVARIANTS · COLLAPSE
      CONDITIONS · CONSEQUENCES.

      - **C15 — Candidate birth.** If signatures match, an isomorphism candidate is
      born.

      - **C16 — Discovery, not assertion.** The match is found by comparing opened
      structures, never declared from vocabulary resemblance.

      - **C17 — Grading.** IC-0 through IC-5; only IC-4 or IC-5 supports a serious
      structural-convergence claim.

      - **C18 — Pressure test.** Remove labels, permute pairings, construct the strongest
      rival mapping, measure the preferred mapping''s advantage.

      - **C19 — Why-Gate.** WHY_CLOSED (with level), WHY_FAILED, or WHY_OPEN — and
      WHY_OPEN is preserved, not resolved.

      - **C20 — Bridge record.** A surviving isomorphism is stored as a bridge atom
      (class BR) naming preserved structure, lost structure, grade, countermodels,
      and the next discriminating test. It propagates as a bridge — never as a proof.'
    F. The Universal Grammar: '- **C21 — Emergent structure.** UNIVERSAL GRAMMAR =
      all admitted atoms + all confirmed isomorphisms (IC-4/5, WHY-gated) + typed
      dependency edges between them, viewed whole.'
    G. Recursion Termini: '- **C22 — Three termini.** PRIMITIVE (the Mark: distinction
      itself), EMPIRICAL INPUT (INDEPENDENT_EMPIRICAL_INPUT), OPEN (unresolved, preserved
      with rivals and next test).

      - **C23 — Discipline.** No expansion may terminate in a label borrowed from
      the answer.'
    H. Non-Negotiable Guards: '- **C24 — Guards.** Analogy is never promoted to identity;
      a bridge never propagates as proof; a specification is never reported as a theorem;
      a selection criterion is never written after the pattern is seen; no automated
      run canonizes; corrections print where claims printed; the resolver resolves
      references but never creates authority; the guard tool enforces format but never
      grades truth.'
    I. The One-Sentence Summary: '- **C25 — Canon in one sentence.** Every claim is
      an atom; every atom opens along its register into sub-atoms; when two opened
      structures match without names, an isomorphism is born, graded, and gated —
      and the universal grammar is simply everything that survives.'
    Axiomatic Status: 'These definitions function as axioms for the methodology: they
      are stipulated, not derived. They are the floor from which the argument chain
      (S03) proceeds. Any challenge to the canon must either accept these stipulations
      or propose a rival spine.'
    S03 — Argument Chain: 'The Claim Atom Expansion Canon is not a deductive proof
      but a methodological argument: it proposes a set of definitions and rules and
      argues that, if followed, they yield a rigorous, bottom-up universal grammar.
      The chain below reconstructs that argument step by step, showing how each move
      depends on the previous ones.'
    Step 1 — The atomic unit is defined (C1–C7): 'The canon begins by stipulating
      that the fundamental unit of the corpus is the **atom**: one claim record with
      one assertion, one hash, one state, one grade (C1). This unit is given an immutable
      identity (A###, C3), a layer (L#, C4), and a component (C#) for decomposed sub-claims
      (C5). The address scheme `claims / A042 / L9 / C1` (C2) makes every atom uniquely
      locatable. Each atom is represented in dual format from a single canonical source
      (C6) and carries a fixed metadata spine: claim/evidence/proof plus five axes
      (C7).


      **Move:** Establish a stable, addressable, metadata-rich unit so that all subsequent
      operations (expansion, comparison, grading) have a well-defined subject.'
    Step 2 — Expansion is register-native (C8–C13): 'A claim is not opened arbitrarily;
      it opens along its **register** (C8). Each register has a native expansion template
      that specifies the anatomy of what must be true for that kind of claim to hold:


      - History claims open into a transmission chain from EVENT to PRESENT CLAIM
      (C9).

      - Physics claims open into a measurement anatomy from QUANTITY to CLAIM (C10).

      - Math claims open into a formal anatomy from DEFINITION to RECEIPT (C11).

      - Theological claims open into a proclamation anatomy from SOURCE to SCOPE (C12).

      - Bridge claims open into a mapping anatomy from SOURCE REGISTER to NEXT TEST
      (C13).


      **Move:** Ensure that expansion is not ad hoc but follows the internal logic
      of the claim''s domain. This is what makes the resulting sub-atoms meaningful
      and comparable.'
    Step 3 — Fully opened atoms yield invariant signatures (C14): 'When two atoms
      from any two registers are both fully opened, their **invariant signatures**
      can be compared without names (C14). The signature consists of nine structural
      features: IDENTITIES, DISTINCTIONS, RELATIONS, OPERATIONS, DEPENDENCIES, CONSTRAINTS,
      INVARIANTS, COLLAPSE CONDITIONS, CONSEQUENCES.


      **Move:** Provide a name-free, register-neutral basis for structural comparison.
      This is the key move that allows cross-domain isomorphism to be discovered rather
      than asserted.'
    Step 4 — Matching signatures produce an isomorphism candidate (C15–C16): 'If the
      signatures match, an isomorphism **candidate** is born (C15). Crucially, this
      is **discovery, not assertion** (C16): the match is found by comparing opened
      structures, never declared from vocabulary resemblance.


      **Move:** Separate the discovery of a candidate from its validation. A match
      is a hypothesis, not a conclusion.'
    Step 5 — Candidates are graded and pressure-tested (C17–C18): 'The candidate receives
      an IC grade from IC-0 to IC-5 (C17). Only IC-4 (shared dependency graph and
      capability classes) or IC-5 (plus collapse and translation behavior) supports
      a serious structural-convergence claim. The candidate must then face the **pressure
      test** (C18): remove labels, permute pairings, construct the strongest rival
      mapping, and measure whether the preferred mapping has a real advantage.


      **Move:** Introduce a graded, adversarial filter that distinguishes genuine
      structural convergence from superficial resemblance.'
    Step 6 — Surviving candidates face the Why-Gate (C19): 'Even a high-grade candidate
      must answer: why does this correspondence exist? The outcome is one of WHY_CLOSED
      (with level), WHY_FAILED, or WHY_OPEN — and WHY_OPEN is preserved, not resolved
      (C19).


      **Move:** Force the methodology to confront the explanatory question without
      allowing premature closure. Preserving WHY_OPEN prevents the canon from smuggling
      in unearned explanations.'
    Step 7 — Surviving isomorphisms become bridge atoms (C20): 'A surviving isomorphism
      is stored as a **bridge atom** (class BR) naming preserved structure, lost structure,
      grade, countermodels, and the next discriminating test (C20). It propagates
      as a bridge — never as a proof.


      **Move:** Institutionalize the result in a form that carries its own limitations
      and next steps, preventing the bridge from being mistaken for a proof.'
    Step 8 — The universal grammar emerges (C21): 'The universal grammar is not written
      top-down. It is the **emergent structure** of the admitted graph: all admitted
      atoms + all confirmed isomorphisms (IC-4/5, WHY-gated) + the typed dependency
      edges between them, viewed whole (C21).


      **Move:** Derive the grammar from the bottom up, so that every node and edge
      has earned its place through the pipeline. This is the canon''s central claim:
      the grammar is what survives scrutiny.'
    Step 9 — Expansion terminates at three floors (C22–C23): 'Expansion continues
      downward until it reaches one of three termini: PRIMITIVE (the Mark: distinction
      itself), EMPIRICAL INPUT (INDEPENDENT_EMPIRICAL_INPUT), or OPEN (unresolved,
      preserved with rivals and next test) (C22). No expansion may terminate in a
      label borrowed from the answer (C23).


      **Move:** Prevent infinite regress and circularity. The three termini mark the
      honest limits of the method.'
    Step 10 — Guards enforce the discipline (C24): 'Eight non-negotiable guards (C24)
      protect the chain from the most common failure modes: promoting analogy to identity,
      propagating a bridge as proof, reporting a specification as a theorem, writing
      a selection criterion after seeing the pattern, automated canonization, silent
      editing, resolver-created authority, and guard-tool truth-grading.


      **Move:** Provide a final layer of procedural safeguards that keep the methodology
      honest at every step.'
    Step 11 — The one-sentence summary (C25): 'The entire chain is compressed into
      one sentence: *Every claim is an atom; every atom opens along its register into
      sub-atoms; when two opened structures match without names, an isomorphism is
      born, graded, and gated — and the universal grammar is simply everything that
      survives.* (C25)


      **Move:** State the canon''s thesis in a form that can be tested against each
      step of the chain.'
    Chain Summary: "The argument chain is a pipeline:\n\n```text\nATOM (C1–C7)\n \
      \ → REGISTER-NATIVE EXPANSION (C8–C13)\n    → INVARIANT SIGNATURE (C14)\n  \
      \    → ISOMORPHISM CANDIDATE (C15–C16)\n        → GRADING & PRESSURE TEST (C17–C18)\n\
      \          → WHY-GATE (C19)\n            → BRIDGE ATOM (C20)\n             \
      \ → EMERGENT UNIVERSAL GRAMMAR (C21)\n                → RECURSION TERMINI (C22–C23)\n\
      \                  → GUARDS (C24)\n                    → ONE-SENTENCE SUMMARY\
      \ (C25)\n```\n\nEach step depends on the previous ones. The chain is not a proof\
      \ of the canon's truth but a demonstration of its internal coherence: if you\
      \ accept the atomic unit and the expansion rule, the rest follows as a disciplined\
      \ procedure for building a universal grammar from the bottom up."
