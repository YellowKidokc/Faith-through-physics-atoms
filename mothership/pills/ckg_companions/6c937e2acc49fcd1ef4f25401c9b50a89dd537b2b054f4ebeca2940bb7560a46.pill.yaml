      draft.'
    S05 — Objections and Counterarguments: 'The Claim Atom Expansion Canon is a methodological
      proposal. As such, it is open to objections at every level: its foundational
      definitions, its expansion rule, its isomorphism rule, its claim to an emergent
      universal grammar, and its practical feasibility. This section catalogs the
      strongest objections and, where the canon provides resources for a response,
      states them. Where it does not, the objection is left standing as an open challenge.'
    Objection 1 — The atomic unit is not atomic: '**Objection:** The canon defines
      an atom as "one claim record, carrying the minimal unified record" (C1), but
      then immediately decomposes it into layers (L#) and components (C#). If an atom
      can be decomposed into sub-claims, it is not atomic in any meaningful sense.
      The term "atom" is a misnomer; the unit is a bundle, not an indivisible entity.


      **Response:** The canon''s atom is atomic at the level of *identity*, not at
      the level of *content*. An atom has one immutable identity (A###), one hash,
      one state, one grade (C1, C3). Its components (C#) are separately graded because
      they may fail independently (C5). The atomicity is operational: the atom is
      the smallest unit that can be admitted, graded, and referenced as a whole. The
      decomposition into components is a refinement, not a violation of atomicity.
      This is analogous to how a chemical atom has internal structure but is still
      the unit of chemical identity.


      **Status:** Responded.'
    Objection 2 — The expansion templates are stipulated, not derived: '**Objection:**
      The register-native templates (C9–C13) are presented as "the anatomy of what
      must be true for that kind of claim to hold" (C8). But where do these templates
      come from? They are asserted, not derived from any more basic principle. A rival
      methodology could propose different templates with equal justification. The
      canon provides no argument that its templates are the *correct* ones.


      **Response:** The canon does not claim that its templates are uniquely correct.
      It claims that they are *native* to their registers — that they reflect the
      internal logic of historical, physical, mathematical, theological, and bridge
      claims. The templates are open to revision: if a register''s template is found
      to be incomplete or incorrect, it can be amended. The canon''s guards (C24)
      explicitly forbid treating a specification as a theorem, and the templates are
      specifications. Their justification is pragmatic: they make expansion possible
      and comparable. The canon''s bet is that these templates will survive use and
      refinement, not that they are a priori necessary.


      **Status:** Responded, but the objection retains force: the canon does not provide
      a derivation of the templates, only a pragmatic defense.'
    Objection 3 — The invariant signature is not demonstrably register-neutral: '**Objection:**
      The invariant signature (C14) is claimed to allow comparison "without names."
      But the nine elements — IDENTITIES, DISTINCTIONS, RELATIONS, OPERATIONS, DEPENDENCIES,
      CONSTRAINTS, INVARIANTS, COLLAPSE CONDITIONS, CONSEQUENCES — are themselves
      a vocabulary. They may be biased toward certain kinds of structures (e.g., formal/mathematical
      ones) and may fail to capture what is essential in other registers (e.g., narrative
      or experiential claims). The signature may be a Procrustean bed.


      **Response:** The canon does not claim that the signature is exhaustive or that
      it captures everything. It claims that it provides a *basis* for comparison.
      If a register''s claims cannot be adequately represented in the signature, that
      is a finding: it would show that the signature needs expansion or that the register
      is not comparable to others at the same level. The canon''s Why-Gate (C19) and
      pressure test (C18) are designed to catch false matches. The signature is a
      tool, not a metaphysical claim about the structure of reality.


      **Status:** Responded, but the objection highlights a real risk: the signature
      may impose a formalist bias.'
    Objection 4 — The isomorphism rule cannot distinguish discovery from construction: '**Objection:**
      The canon insists that isomorphism is "discovery, not assertion" (C16), found
      by comparing opened structures. But the act of opening a structure along a register-native
      template is itself a constructive act. The template determines what counts as
      a sub-atom, and thus what will appear in the invariant signature. By choosing
      the template, the analyst may inadvertently construct the match. The pressure
      test (C18) is supposed to guard against this, but it is conducted by the same
      analyst using the same templates.


      **Response:** This is the strongest objection. The canon''s response is procedural:
      the pressure test requires removing labels, permuting pairings, and constructing
      the strongest rival mapping (C18). If the preferred mapping has no real advantage
      over rivals, the candidate fails. The Why-Gate (C19) further requires an explanation
      of why the correspondence exists. These are adversarial checks, but they are
      not independent of the analyst. The canon acknowledges this by preserving WHY_OPEN
      rather than resolving it (C19). The ultimate guard is the community of practitioners
      and the requirement that all expansions and comparisons be public and reproducible.


      **Status:** Partially responded. The objection identifies a genuine limitation:
      the method cannot fully eliminate the analyst''s constructive role. The canon''s
      guards mitigate but do not eliminate this.'
    Objection 5 — The universal grammar is either trivial or unattainable: '**Objection:**
      The universal grammar is defined as the set of all admitted atoms plus all confirmed
      isomorphisms plus their dependency edges (C21). If admission is strict, the
      grammar may be nearly empty — trivial. If admission is lax, the grammar may
      include spurious isomorphisms — unrigorous. The canon provides no criteria for
      admission beyond the IC grade and Why-Gate, which are themselves applied by
      fallible analysts. The grammar may be either too small to be interesting or
      too large to be trustworthy.


      **Response:** The canon embraces this tension. The grammar is *emergent*: it
      is whatever survives the pipeline. If that is small, it is small. The canon
      does not promise a rich grammar; it promises an honest one. The guards (C24)
      ensure that nothing is admitted without earning its place. The grammar''s value
      is not in its size but in its reliability: every node and edge has survived
      scrutiny. If the grammar is trivial, that is a finding about the limits of cross-register
      structural convergence.


      **Status:** Responded. The objection is reframed as a feature, not a bug.'
    Objection 6 — The recursion termini are not exhaustive: '**Objection:** Expansion
      terminates at PRIMITIVE, EMPIRICAL INPUT, or OPEN (C22). But there may be other
      legitimate termini: e.g., a claim that is simply *undefined* in the current
      framework, or a claim that is *inconsistent* with the framework, or a claim
      that is *irrelevant* to the framework. The canon''s three termini may force
      premature closure or misclassification.


      **Response:** The canon''s termini are methodological, not metaphysical. A claim
      that is undefined or inconsistent would be marked OPEN with its rivals and next
      test. Irrelevance is a judgment about the framework''s scope, not a terminus
      of expansion. The canon''s discipline is that no expansion may terminate in
      a label borrowed from the answer (C23). If a claim cannot be opened further
      without circularity, it is OPEN. The three termini are the honest floors: the
      primitive, the empirical, and the unresolved.


      **Status:** Responded, but the objection suggests that the termini may need
      refinement in practice.'
    Objection 7 — The guards are necessary but insufficient: '**Objection:** The eight
      guards (C24) are procedural safeguards, but they do not guarantee correctness.
      They forbid certain errors (promoting analogy to identity, propagating bridges
      as proofs, etc.), but they do not ensure that the remaining claims are true.
      A claim can pass all guards and still be false. The canon provides no truth
      criterion.


      **Response:** The canon does not claim to provide a truth criterion. It provides
      a *rigor* criterion: claims are admitted only if they survive expansion, grading,
      pressure-testing, and gating. Truth is not the same as rigor. The canon''s guards
      are designed to prevent the most common forms of self-deception, not to guarantee
      truth. The canon is a methodology for structuring claims, not a theory of truth.
      It is compatible with a range of truth theories (correspondence, coherence,
      pragmatic).


      **Status:** Responded. The objection is correct but does not undermine the canon''s
      purpose.'
    Objection 8 — The canon is unfalsifiable: '**Objection:** The canon claims that
      the universal grammar is "what remains when everything that could not survive
      scrutiny has been honestly removed" (C21). But if the grammar turns out to be
      trivial or incoherent, the canon can always say that the scrutiny was not honest
      enough or that the corpus was not rich enough. The canon appears to be immune
      to empirical disconfirmation.


      **Response:** The canon is falsifiable in principle. If a claim that passes
      all guards and survives all tests is later shown to be false, that would falsify
      the canon''s claim that its pipeline produces reliable results. If two fully
      opened structures with matching invariant signatures are later shown to have
      no structural correspondence, that would falsify the isomorphism rule. The canon''s
      predictions are conditional: *if* you follow the pipeline, *then* you will get
      a grammar that survives scrutiny. If the grammar does not survive scrutiny,
      the canon is falsified. The canon is not a metaphysical system; it is a methodology
      with testable consequences.


      **Status:** Responded, but the objection highlights the need for concrete case
      studies to test the canon.'
    Objection 9 — The canon is too complex to be practical: '**Objection:** The canon
      requires atoms to be addressed, layered, componentized, dual-formatted, and
      metadata-tagged (C1–C7). Expansion requires register-native templates (C8–C13).
      Isomorphism requires invariant signatures, grading, pressure tests, Why-Gates,
      and bridge records (C14–C20). The universal grammar requires all of this to
      be done for every claim (C21). This is an enormous overhead. In practice, no
      one will follow it.


      **Response:** The canon is designed for a specific kind of corpus: one where
      rigor and traceability are paramount. It is not intended for casual note-taking.
      The overhead is the point: it forces the analyst to make every assumption explicit
      and every inference traceable. The canon can be applied incrementally: start
      with a small set of claims, expand them, and see if the method yields insight.
      If it does, scale up. If it does not, the canon has failed a practical test.
      The canon''s guards (C24) include "no automated run canonizes; the human rules
      admission," which acknowledges that the method is labor-intensive and requires
      human judgment.


      **Status:** Responded. The objection is a practical warning, not a refutation.'
    Objection 10 — The canon conflates structure with meaning: '**Objection:** The
      canon treats claims as structures that can be compared via invariant signatures
      (C14). But claims also have *meaning* — semantic content that may not be captured
      by structural features. Two claims may have identical invariant signatures but
      mean different things. The canon''s focus on structure may lead to a neglect
      of meaning, and thus to false isomorphisms.


      **Response:** The canon does not deny that claims have meaning. It claims that
      structural comparison is a *necessary* condition for isomorphism, not a sufficient
      one. The Why-Gate (C19) is precisely the point at which meaning enters: the
      analyst must explain *why* the correspondence exists. If the explanation appeals
      to meaning, that is legitimate. The canon''s guards (C24) forbid promoting analogy
      to identity, which is a guard against mistaking structural similarity for semantic
      identity. The canon is a tool for disciplined structural comparison, not a replacement
      for semantic analysis.


      **Status:** Responded. The objection is addressed by the Why-Gate and the guards.'
    Summary of Objections: '| # | Objection | Status |

      |---|---|---|

      | 1 | The atomic unit is not atomic. | Responded. |

      | 2 | The expansion templates are stipulated, not derived. | Responded, but
      force remains. |

      | 3 | The invariant signature is not demonstrably register-neutral. | Responded,
      but risk remains. |

      | 4 | The isomorphism rule cannot distinguish discovery from construction. |
      Partially responded. |

      | 5 | The universal grammar is either trivial or unattainable. | Responded.
      |

      | 6 | The recursion termini are not exhaustive. | Responded. |

      | 7 | The guards are necessary but insufficient. | Responded. |

      | 8 | The canon is unfalsifiable. | Responded. |

      | 9 | The canon is too complex to be practical. | Responded. |

      | 10 | The canon conflates structure with meaning. | Responded. |'
    Open Challenges: 'The following objections are not fully resolved by the canon''s
      internal resources and remain open challenges:


      - **Objection 2:** The canon does not derive its templates from first principles.
      A derivation or a comparative justification would strengthen the canon.

      - **Objection 3:** The invariant signature may impose a formalist bias. Empirical
      work is needed to test its adequacy across registers.

      - **Objection 4:** The analyst''s constructive role cannot be fully eliminated.
      The canon''s procedural guards mitigate but do not solve this. Independent replication
      and adversarial collaboration are needed.

      - **Objection 8:** The canon needs concrete case studies to demonstrate its
      falsifiability and practical value.


      These open challenges are consistent with the canon''s own spirit: they are
      marked OPEN, preserved with their rivals and next tests, rather than resolved
      by fiat.'
    S06 — Theological/Philosophical Translation: 'The Claim Atom Expansion Canon is
      a methodological document, but its structure is not theologically or philosophically
      neutral. It carries a metaphysics in its bones: a commitment to the primacy
      of distinction, the reality of structure, the discipline of analogy, and the
      humility of the open question. This section translates the canon''s apparatus
      into theological and philosophical terms, showing where it resonates with classical
      traditions and where it makes claims that those traditions would recognize,
      challenge, or refine.'
    A. The Atom and the Doctrine of Divine Simplicity: 'The canon''s atom is "one
      claim record, carrying the minimal unified record" (C1), with an immutable identity
      (A###, C3), a layer (L#, C4), and components (C#, C5). This structure is a methodological
      echo of the classical doctrine of **divine simplicity**: God is not composed
      of parts, yet God''s attributes are not identical to one another in our understanding.
      The atom is simple in identity but complex in content. Its components are graded
      separately because they may fail independently (C5) — just as theological claims
      about God''s justice and God''s mercy may be distinguished without dividing
      the divine essence.


      The analogy is not identity. The canon''s atom is a created, fallible record;
      God is not. But the structural pattern — unity of identity, multiplicity of
      expression — is one that classical theology has long explored. The canon''s
      insistence that the atom is the unit of admission, not the bundle, mirrors the
      theological insistence that the object of faith is one God, not a collection
      of attributes.'
    B. The Expansion Rule and the Analogy of Being: 'The canon''s expansion rule (C8)
      holds that a claim opens along its register into register-native sub-atoms.
      This is structurally analogous to the classical **analogy of being** (*analogia
      entis*): created things resemble God without being identical to God, and the
      resemblance is governed by the mode of being proper to each. The canon''s registers
      — history, physics, math, theology, bridge — are modes of claim-being, each
      with its own native anatomy.


      The theological template (C12) is especially telling: `SOURCE → WITNESS TRADITION
      → PROCLAMATION → REGISTER → CONFESSION CLASS → SCOPE`. This is not a proof chain;
      it is a **proclamation chain**. It traces how a theological claim arises from
      a source, is carried by a witnessing tradition, is proclaimed, is registered
      in a confessional context, and is scoped. The canon''s guard that theological
      atoms "are never laundered into class T or E by expansion" (C12) is a formalization
      of the theological principle that the mode of theological discourse is not reducible
      to the mode of empirical or mathematical discourse. Expansion clarifies what
      the claim *is*; it never upgrades what the claim *proves*.'
    C. The Invariant Signature and the Via Negativa: 'The invariant signature (C14)
      is a nine-element structural fingerprint: IDENTITIES, DISTINCTIONS, RELATIONS,
      OPERATIONS, DEPENDENCIES, CONSTRAINTS, INVARIANTS, COLLAPSE CONDITIONS, CONSEQUENCES.
      It is designed to allow comparison "without names." This is a methodological
      version of the **via negativa**: by stripping away names and labels, the canon
      seeks to compare structures at a level where vocabulary cannot bias the result.


      The via negativa in classical theology (e.g., Pseudo-Dionysius, John of the
      Cross) holds that God is known most truly by negation — by saying what God is
      not. The canon''s signature is not a negation of names but a *suspension* of
      them. It asks: if we remove the labels, do the structures still match? This
      is a disciplined form of apophatic comparison. It does not claim that the structures
      are God; it claims that they are comparable in a way that names alone cannot
      guarantee.


      The risk, noted in S05 (Objection 3), is that the signature may impose a formalist
      bias. Theologically, this is the risk of **onto-theology**: allowing a formal
      schema to dictate what can be said about God. The canon''s Why-Gate (C19) and
      pressure test (C18) are designed to catch false matches, but they do not eliminate
      the risk. The canon''s response — that the signature is a tool, not a metaphysical
      claim — is theologically sound: it refuses to identify its method with the divine
      nature.'
    D. The Isomorphism Rule and the Discovery/Construction Distinction: 'The canon
      insists that isomorphism is "discovery, not assertion" (C16). This is a philosophical
      distinction with deep roots. In Plato, discovery (*anamnesis*) is the recollection
      of what the soul already knows; in Aristotle, discovery is the actualization
      of potential; in modern philosophy, the distinction between discovery and construction
      is central to debates about realism and anti-realism.


      The canon''s position is **critical realism**: structures are real, but our
      access to them is mediated by templates, signatures, and pressure tests. The
      isomorphism candidate is not constructed by fiat; it is found by comparing opened
      structures. But the act of opening is itself constructive (Objection 4). The
      canon acknowledges this by preserving WHY_OPEN rather than resolving it (C19).
      Theologically, this is the posture of **faith seeking understanding** (*fides
      quaerens intellectum*): the believer does not construct God, but neither does
      the believer have unmediated access to God. The Why-Gate is the methodological
      equivalent of the theological question: *why does this correspondence exist?*
      — a question that may be answered, failed, or left open.'
    E. The Universal Grammar and the Logos: 'The canon''s universal grammar (C21)
      is "the emergent structure of the admitted graph": all admitted atoms + all
      confirmed isomorphisms (IC-4/5, WHY-gated) + typed dependency edges, viewed
      whole. It is built bottom-up, never top-down.


      Theologically, this is a striking inversion of the classical **Logos** doctrine.
      In John 1:1, the Logos is *in the beginning*, prior to all things, the principle
      through which all things were made. The canon''s grammar is not prior; it is
      emergent. It is not the source of the atoms; it is what the atoms become when
      they survive scrutiny. The grammar is not the Logos; it is a **created participation
      in the Logos** — a human, fallible, bottom-up reconstruction of the order that
      the Logos establishes.


      This is not a rejection of the Logos doctrine; it is a methodological translation
      of it. The canon does not claim to write the Logos. It claims to build a grammar
      that, if it works, will be a finite image of the Logos. The guard that "no automated
      run canonizes; the human rules admission" (C24) is a theological safeguard:
      the grammar is not a machine output; it is a human act of discernment, subject
      to correction and open to the possibility that the Logos exceeds it.'
    F. The Recursion Termini and the Theological Floor: 'The canon''s three termini
      (C22) are PRIMITIVE (the Mark: distinction itself), EMPIRICAL INPUT (INDEPENDENT_EMPIRICAL_INPUT),
      and OPEN (unresolved, preserved with rivals and next test).


      The PRIMITIVE terminus — "the Mark: distinction itself" — is theologically resonant
      with the doctrine of **creation ex nihilo** and the primordial act of distinction.
      In Genesis 1, God separates light from darkness, waters from waters, day from
      night. Distinction is the first act of creation. The canon''s Mark is not God;
      it is the methodological floor at which distinction itself is posited. But the
      structural parallel is unmistakable: the grammar begins with distinction, not
      with identity.


      The EMPIRICAL INPUT terminus is theologically analogous to **revelation**: a
      datum that the framework does not derive but receives. The canon records it
      as INDEPENDENT_EMPIRICAL_INPUT. Theologically, this is the posture of **receptivity**:
      the framework is not self-contained; it depends on what it does not generate.


      The OPEN terminus is theologically analogous to **eschatological reserve**:
      the unresolved question is preserved, not resolved. The canon''s discipline
      — "No expansion may terminate in a label borrowed from the answer" (C23) — is
      a formalization of the theological prohibition against **idolatry**: the refusal
      to identify the answer with the framework''s own categories. The OPEN terminus
      is the methodological equivalent of the theological *apophatic* reserve: the
      question remains open because the answer exceeds the method.'
    G. The Guards and the Theological Virtues: 'The eight guards (C24) can be read
      as a translation of classical theological virtues and disciplines:


      | Guard | Theological resonance |

      |---|---|

      | Analogy is never promoted to identity. | The *analogia entis*: created resemblance
      is not divine identity. |

      | A bridge never propagates as proof. | The distinction between *fides* and
      *scientia*: faith is not proof. |

      | A specification is never reported as a theorem. | The distinction between
      *promise* and *fulfillment*: the specification is not the receipt. |

      | A selection criterion is never written after the pattern is seen. | The prohibition
      against *post hoc* rationalization: the criterion must precede the pattern.
      |

      | No automated run canonizes; the human rules admission. | The doctrine of *conscience*:
      judgment is a human act, not a machine output. |

      | Corrections print where claims printed; nothing is silently edited or deleted.
      | The practice of *confession*: error is acknowledged, not hidden. |

      | The resolver resolves references; it never creates authority. | The distinction
      between *tradition* and *magisterium*: tradition transmits, it does not create.
      |

      | The guard tool enforces format; it never grades truth. | The distinction between
      *discipline* and *discernment*: format is not truth. |


      These resonances are not accidental. The canon''s guards are procedural translations
      of theological disciplines that have been refined over centuries. They are not
      theological claims; they are methodological safeguards that happen to align
      with theological wisdom.'
    H. The One-Sentence Version and the Theological Summary: 'The canon''s one-sentence
      version (C25) reads: *Every claim is an atom; every atom opens along its register
      into sub-atoms; when two opened structures match without names, an isomorphism
      is born, graded, and gated — and the universal grammar is simply everything
      that survives.*


      Theologically, this can be translated as: *Every creature is a word; every word
      opens along its mode of being into sub-words; when two opened structures match
      without names, a participation is discovered, graded, and gated — and the universal
      grammar is simply everything that survives the scrutiny of the Logos.*


      This translation is not the canon. It is a theological reading of the canon.
      The canon does not claim to be theology; it claims to be a methodology that
      can be used by theologians and non-theologians alike. But the structural parallels
      are deep enough that the canon can be read as a **formalized theological epistemology**:
      a way of structuring claims that respects the distinction between registers,
      the discipline of analogy, the humility of the open question, and the eschatological
      reserve of the unresolved.'
    I. What the Translation Does Not Claim: 'The translation does not claim that:


      - The canon is a theological document.

      - The universal grammar is the Logos.

      - The Mark is God.

      - The isomorphism rule is a proof of divine action.

      - The guards are theological virtues.

      - The canon''s method is a substitute for revelation, faith, or tradition.


      The translation claims only that the canon''s structure is **theologically legible**:
      it can be read in theological terms without being reduced to them. This is consistent
      with the canon''s own guards: analogy is never promoted to identity (C24). The
      translation is an analogy, not an identity. It is offered as a bridge — with
      its preserved structure, its lost structure, its grade, its countermodels, and
      its next test.'
    S07 — Formal and Mathematical Layer: 'The Claim Atom Expansion Canon is a methodological
      document, but its structure is formalizable. This section extracts the formal
      and mathematical layer implicit in the canon: the typed objects, the address
      algebra, the expansion function, the invariant signature as a feature vector,
      the isomorphism grading as a partial order, the universal grammar as a set-theoretic
      construction, and the recursion termini as a well-foundedness condition. The
      formalization is offered as a reconstruction, not as a claim that the canon
      is a mathematical theory. It is a tool for making the canon''s commitments explicit
      and for identifying where the canon is underdetermined.'
    A. Typed Objects: 'The canon''s universe of discourse consists of the following
      typed objects:


      | Type | Symbol | Description | Source |

      |---|---|---|---|

      | Atom | `A` | A claim record with identity, layer, component, metadata. | C1–C7
      |

      | Address | `Addr` | A triple `(a, l, c)` where `a ∈ A###`, `l ∈ L#`, `c ∈ C#`.
      | C2 |

      | Register | `R` | One of `{HISTORY, PHYSICS, MATH, THEOLOGY, BRIDGE}`. | C8–C13
      |

      | Template | `T_r` | A finite sequence of sub-atom types native to register
      `r`. | C9–C13 |

      | Signature | `Σ` | A 9-tuple of structural features. | C14 |

      | IC Grade | `g` | An element of `{IC-0, IC-1, IC-2, IC-3, IC-4, IC-5}`. | C17
      |

      | Why-Outcome | `w` | An element of `{WHY_CLOSED(level), WHY_FAILED, WHY_OPEN}`.
      | C19 |

      | Bridge | `B` | A record `(preserved, lost, grade, countermodels, next_test)`.
      | C20 |

      | Terminus | `τ` | An element of `{PRIMITIVE, EMPIRICAL_INPUT, OPEN}`. | C22
      |

      | Grammar | `G` | A set of atoms, isomorphisms, and typed edges. | C21 |'
    B. The Address Algebra: 'An address is a triple:


      ```text

      Addr = (a, l, c)  where  a ∈ A###,  l ∈ L#,  c ∈ C#

      ```


      The address scheme is a **free monoid** over the alphabet `{A, L, C}` with the
      concatenation operation `/`. The canonical form is:


      ```text

      claims / A042 / L9 / C1

      ```


      **Properties:**


      - **Injectivity:** Each address maps to exactly one atom. No two atoms share
      an address.

      - **Immutability:** The atom identifier `a` is never reused or deleted (C3).

      - **Compositionality:** The address of a sub-atom is the address of its parent
      extended by a new component index.'
    C. The Expansion Function: 'Let `A` be the set of atoms and `R` the set of registers.
      Define the expansion function:


      ```text

      open : A × R → P(A)

      ```


      where `open(a, r)` returns the set of register-native sub-atoms of `a` under
      register `r`. The function is defined by the templates:


      ```text

      open(a, HISTORY)   = {a_1, ..., a_10}  following T_HISTORY

      open(a, PHYSICS)   = {a_1, ..., a_9}   following T_PHYSICS

      open(a, MATH)      = {a_1, ..., a_6}   following T_MATH

      open(a, THEOLOGY)  = {a_1, ..., a_6}   following T_THEOLOGY

      open(a, BRIDGE)    = {a_1, ..., a_8}   following T_BRIDGE

      ```


      **Constraints:**


      - **Register-native:** `open(a, r)` is defined only if `r` is the register of
      `a`. A claim cannot be opened along a foreign register.

      - **Recursive:** Each `a_i ∈ open(a, r)` is itself an atom and may be opened
      further.

      - **Terminating:** Expansion must reach a terminus `τ ∈ {PRIMITIVE, EMPIRICAL_INPUT,
      OPEN}` (C22).

      - **Non-circular:** No expansion may terminate in a label borrowed from the
      answer (C23).'
    D. The Invariant Signature as a Feature Vector: 'The invariant signature is a
      9-tuple:


      ```text

      Σ(a) = (I, D, R, O, Dep, C, Inv, Col, Con)

      ```


      where:


      | Component | Symbol | Meaning |

      |---|---|---|

      | Identities | `I` | The set of identity conditions of the atom. |

      | Distinctions | `D` | The set of distinctions the atom draws. |

      | Relations | `R` | The set of relations the atom participates in. |

      | Operations | `O` | The set of operations the atom supports. |

      | Dependencies | `Dep` | The set of dependencies the atom has. |

      | Constraints | `C` | The set of constraints the atom imposes. |

      | Invariants | `Inv` | The set of invariants the atom preserves. |

      | Collapse Conditions | `Col` | The conditions under which the atom collapses.
      |

      | Consequences | `Con` | The set of consequences the atom entails. |


      **Comparison:** Two atoms `a` and `b` are **signature-comparable** if `Σ(a)`
      and `Σ(b)` are defined and can be compared component-wise. The comparison is
      performed **without names** (C14): the labels of `a` and `b` are not used in
      the comparison.


      **Matching:** A match is a bijection `φ : Σ(a) → Σ(b)` that preserves the structural
      relations among the components. The existence of such a `φ` is the birth of
      an isomorphism candidate (C15).'
    E. Isomorphism Grading as a Partial Order: 'The IC grades form a total order:


      ```text

      IC-0 < IC-1 < IC-2 < IC-3 < IC-4 < IC-5

      ```


      **Interpretation:**


      | Grade | Meaning |

      |---|---|

      | IC-0 | No structural correspondence. |

      | IC-1 | Superficial resemblance. |

      | IC-2 | Partial structural correspondence. |

      | IC-3 | Substantial structural correspondence. |

      | IC-4 | Shared dependency graph and capability classes. |

      | IC-5 | IC-4 plus collapse and translation behavior. |


      **Threshold:** Only `IC-4` or `IC-5` supports a serious structural-convergence
      claim (C17).'
    F. The Pressure Test as an Adversarial Procedure: 'The pressure test (C18) is
      a procedure that takes a candidate isomorphism `(a, b, φ)` and returns a verdict:


      ```text

      pressure_test : (A × A × Φ) → {PASS, FAIL}

      ```


      The procedure:


      1. **Remove labels:** Replace all names in `a` and `b` with placeholders.

      2. **Permute pairings:** Generate the set of rival bijections `Φ'' = {φ'' :
      Σ(a) → Σ(b)}`.

      3. **Construct rival mapping:** For each `φ'' ∈ Φ''`, construct the strongest
      rival mapping.

      4. **Measure advantage:** Compute the advantage of `φ` over each `φ''`.

      5. **Verdict:** `PASS` if `φ` has a real advantage over all rivals; `FAIL` otherwise.'
    G. The Why-Gate as a Three-Valued Function: 'The Why-Gate (C19) is a function:


      ```text

      why_gate : (A × A × Φ) → {WHY_CLOSED(level), WHY_FAILED, WHY_OPEN}

      ```


      **Properties:**


      - `WHY_CLOSED(level)` is a positive outcome with a level of explanation.

      - `WHY_FAILED` is a negative outcome: the correspondence does not exist.

      - `WHY_OPEN` is a preserved outcome: the question remains open, with rivals
      and next test.


      **Constraint:** `WHY_OPEN` is preserved, not resolved (C19).'
    H. The Universal Grammar as a Set-Theoretic Construction: 'The universal grammar
      is defined as:


      ```text

      G = A_admitted ∪ I_confirmed ∪ E_typed

      ```


      where:


      - `A_admitted` is the set of all admitted atoms.

      - `I_confirmed` is the set of all confirmed isomorphisms (IC-4/5, WHY-gated).

      - `E_typed` is the set of typed dependency edges between them.


      **Properties:**


      - **Bottom-up:** `G` is constructed from `A_admitted`, `I_confirmed`, and `E_typed`;
      it is never imposed top-down (C21).

      - **Emergent:** `G` is the structure that remains after all non-surviving candidates
      are removed.

      - **Graded:** Every node and edge in `G` carries its grade.'
    I. Recursion Termini as a Well-Foundedness Condition: 'Expansion is a relation
      `→` on atoms:


      ```text

      a → b  iff  b ∈ open(a, r) for some register r

      ```


      **Well-foundedness:** The relation `→` is well-founded: every chain `a_0 → a_1
      → a_2 → ...` terminates at a terminus `τ ∈ {PRIMITIVE, EMPIRICAL_INPUT, OPEN}`
      (C22).


      **Non-circularity:** No chain may terminate in a label borrowed from the answer
      (C23). Formally, if `τ` is a terminus, then `τ` is not a label that appears
      in the statement of the original claim.'
    J. The Guards as Formal Constraints: 'The eight guards (C24) can be formalized
      as constraints on the pipeline:


      | Guard | Formal Constraint |

      |---|---|

      | Analogy is never promoted to identity. | `analogy(a, b) ⇒ ¬identity(a, b)`
      |

      | A bridge never propagates as proof. | `bridge(a, b) ⇒ ¬proof(a, b)` |

      | A specification is never reported as a theorem. | `specification(a) ⇒ ¬theorem(a)`
      |

      | A selection criterion is never written after the pattern is seen. | `criterion(t)
      ⇒ t < t_pattern` |

      | No automated run canonizes; the human rules admission. | `admission(a) ⇒ human_judgment(a)`
      |

      | Corrections print where claims printed; nothing is silently edited or deleted.
      | `correction(a) ⇒ printed(a)` |

      | The resolver resolves references; it never creates authority. | `resolver(a)
      ⇒ ¬authority(a)` |

      | The guard tool enforces format; it never grades truth. | `guard(a) ⇒ format(a)
      ∧ ¬truth(a)` |'
    K. Formal Summary: 'The canon''s formal layer can be summarized as a typed formal
      system:


      ```text

      SYSTEM = (A, R, T, Σ, G, W, τ, Guards)

      ```


      where:


      - `A` is the set of atoms.

      - `R` is the set of registers.

      - `T` is the set of register-native templates.

      - `Σ` is the invariant signature function.

      - `G` is the universal grammar.

      - `W` is the Why-Gate function.

      - `τ` is the set of recursion termini.

      - `Guards` is the set of formal constraints.


      The system is **well-formed** if:


      1. Every atom has a unique address (C2, C3).

      2. Every expansion is register-native (C8).

      3. Every isomorphism candidate is graded and pressure-tested (C17, C18).

      4. Every surviving isomorphism is WHY-gated (C19).

      5. Every expansion terminates at a terminus (C22).

      6. No expansion terminates in a label borrowed from the answer (C23).

      7. All guards are satisfied (C24).'
    L. Formal Gaps: 'The formalization above is a reconstruction. The canon does not
      provide:


      - A formal definition of the structural relations among signature components.

      - A formal definition of the advantage measure in the pressure test.

      - A formal definition of the levels of `WHY_CLOSED`.

      - A formal proof that the expansion relation is well-founded.

      - A formal proof that the universal grammar is non-trivial for any non-empty
      corpus.


      These gaps are flagged as open formal problems. They are consistent with the
      canon''s own spirit: they are marked OPEN, preserved with their rivals and next
      tests, rather than resolved by fiat.'
    S08 — Bridge Integrity and Cross-Domain Checks: 'The Claim Atom Expansion Canon
      is a cross-domain methodology. Its central move is to open claims along register-native
      templates and then compare the resulting structures across registers via invariant
      signatures. This section audits the integrity of those bridges: the internal
      coherence of each register template, the soundness of the cross-register comparison,
      the well-formedness of the universal grammar formula, and the consistency of
      the guards across domains. Where a bridge is weak, it is flagged.'
    A. Register Template Integrity: 'Each register-native template (C9–C13) is a finite
      sequence of sub-atom types. For a template to be a valid bridge component, it
      must satisfy three conditions:


      1. **Completeness:** The sequence covers the anatomy of what must be true for
      a claim of that register to hold.

      2. **Non-redundancy:** No step is a mere restatement of another.

      3. **Termination:** The sequence ends in a claim or receipt, not in an open-ended
      process.


      | Register | Template | Completeness | Non-redundancy | Termination | Verdict
      |

      |---|---|---|---|---|---|

      | History (C9) | EVENT → … → PRESENT CLAIM | Covers transmission from event
      to present claim. | Each link (witness, testimony, transmission, document, preservation,
      corroboration, interpretation) is distinct. | Ends in PRESENT CLAIM. | **Sound.**
      |

      | Physics (C10) | QUANTITY → … → CLAIM | Covers measurement from quantity to
      claim. | Units, dynamics, protocol, instrument, data, controls, fit are distinct.
      | Ends in CLAIM. | **Sound.** |

      | Math (C11) | DEFINITION → … → RECEIPT | Covers formal derivation from definition
      to receipt. | Definition, axiom use, lemma, derivation, theorem statement, receipt
      are distinct. | Ends in RECEIPT. | **Sound.** |

      | Theology (C12) | SOURCE → … → SCOPE | Covers proclamation from source to scope.
      | Source, witness tradition, proclamation, register, confession class, scope
      are distinct. | Ends in SCOPE. | **Sound.** |

      | Bridge (C13) | SOURCE REGISTER → … → NEXT TEST | Covers mapping from source
      to next test. | Source, target, mapping, preserved, lost, grade, countermodels,
      next test are distinct. | Ends in NEXT TEST. | **Sound.** |


      **Finding:** All five templates are internally coherent. No template contains
      a redundant step, and each terminates in a well-defined endpoint. The templates
      are the canon''s strongest operational evidence (S04).'
    B. Cross-Register Comparison Integrity: 'The isomorphism rule (C14–C20) compares
      invariant signatures across registers. For this comparison to be a valid bridge,
      three conditions must hold:


      1. **Register-neutrality:** The signature components must not presuppose any
      one register''s vocabulary.

      2. **Comparability:** The signature components must be defined for atoms from
      any register.

      3. **Non-triviality:** The comparison must be able to distinguish genuine structural
      matches from superficial ones.


      **Check 1 — Register-neutrality.** The nine signature components (IDENTITIES,
      DISTINCTIONS, RELATIONS, OPERATIONS, DEPENDENCIES, CONSTRAINTS, INVARIANTS,
      COLLAPSE CONDITIONS, CONSEQUENCES) are drawn from formal/structural vocabulary.
      They are not specific to history, physics, math, or theology. However, they
      are biased toward formal/mathematical structures (S05, Objection 3). **Verdict:
      Partially sound.** The signature is register-neutral in vocabulary but may be
      register-biased in application.


      **Check 2 — Comparability.** The signature is defined for any fully opened atom.
      Since every atom opens along its register into sub-atoms (C8), and every sub-atom
      is itself an atom, the signature can be computed for any atom at any depth.
      **Verdict: Sound.**


      **Check 3 — Non-triviality.** The pressure test (C18) and Why-Gate (C19) are
      designed to filter superficial matches. The pressure test removes labels, permutes
      pairings, and constructs rival mappings. The Why-Gate requires an explanation
      of why the correspondence exists. **Verdict: Sound in principle, but dependent
      on analyst discipline.** The canon acknowledges this (S05, Objection 4).'
    C. Bridge Atom Integrity: 'A bridge atom (C20) is a record `(preserved, lost,
      grade, countermodels, next_test)`. For a bridge atom to be valid, it must satisfy:


      1. **Loss field mandatory:** A bridge atom that cannot name its lost structure
      does not open (C13).

      2. **Grade assigned:** The bridge must carry an IC grade (C17).

      3. **Countermodels named:** The bridge must name the countermodels it has survived.

      4. **Next test specified:** The bridge must specify the next discriminating
      test.


      **Check:** The canon states that the loss field is mandatory (C13) and that
      the bridge record names preserved structure, lost structure, grade, countermodels,
      and next test (C20). **Verdict: Sound.** The bridge atom is well-specified.


      **Gap:** The canon does not specify how the loss field is populated. What counts
      as "lost structure"? Is it a set, a list, a narrative? This is an open formal
      problem (S07, Formal Gaps).'
    D. Universal Grammar Formula Integrity: 'The universal grammar is defined as (C21):


      ```text

      G = A_admitted ∪ I_confirmed ∪ E_typed

      ```


      For this formula to be well-formed, three conditions must hold:


      1. **A_admitted is well-defined:** The set of admitted atoms must be determined
      by a clear admission procedure.

      2. **I_confirmed is well-defined:** The set of confirmed isomorphisms must be
      determined by the IC grade and Why-Gate.

      3. **E_typed is well-defined:** The typed dependency edges must be determined
      by the expansion relation.


      **Check 1 — A_admitted.** Admission is ruled by the human (C24: "No automated
      run canonizes; the human rules admission"). The canon does not specify the criteria
      for admission beyond the guards. **Verdict: Underdetermined.** The formula is
      well-formed only if admission is well-defined.


      **Check 2 — I_confirmed.** Confirmed isomorphisms are those with IC-4 or IC-5
      and a WHY_CLOSED outcome (C17, C19). **Verdict: Sound.** The criteria are explicit.


      **Check 3 — E_typed.** Typed dependency edges are the edges between atoms in
      the expansion relation. Since expansion is register-native and recursive (C8),
      the edges are well-defined. **Verdict: Sound.**


      **Finding:** The universal grammar formula is well-formed modulo the admission
      procedure. The canon''s reliance on human judgment for admission is a deliberate
      design choice (C24), but it leaves the formula''s extension underdetermined.'
    E. Cross-Domain Guard Consistency: 'The eight guards (C24) are stated as non-negotiable.
      For the bridges to be sound, the guards must be consistently applicable across
      all registers.


      | Guard | History | Physics | Math | Theology | Bridge |

      |---|---|---|---|---|---|

      | Analogy is never promoted to identity. | Applies. | Applies. | Applies. |
      Applies. | Applies. |

      | A bridge never propagates as proof. | Applies. | Applies. | Applies. | Applies.
      | Applies. |

      | A specification is never reported as a theorem. | Applies. | Applies. | Applies.
      | Applies. | Applies. |

      | A selection criterion is never written after the pattern is seen. | Applies.
      | Applies. | Applies. | Applies. | Applies. |

      | No automated run canonizes; the human rules admission. | Applies. | Applies.
      | Applies. | Applies. | Applies. |

      | Corrections print where claims printed; nothing is silently edited or deleted.
      | Applies. | Applies. | Applies. | Applies. | Applies. |

      | The resolver resolves references; it never creates authority. | Applies. |
      Applies. | Applies. | Applies. | Applies. |

      | The guard tool enforces format; it never grades truth. | Applies. | Applies.
      | Applies. | Applies. | Applies. |


      **Finding:** All guards are register-neutral and apply uniformly across domains.
      **Verdict: Sound.**'
    F. Cross-Domain Bridge Checks: 'The canon''s bridges are between registers. The
      following cross-domain checks verify that the bridges are structurally sound:


      **Check 1 — History ↔ Physics.** Both templates trace a chain from a source
      (EVENT / QUANTITY) to a claim (PRESENT CLAIM / CLAIM). The history chain emphasizes
      transmission and preservation; the physics chain emphasizes protocol and controls.
      The invariant signature can compare them: both have identities (event/quantity),
      distinctions (witness/instrument), relations (transmission/protocol), operations
      (interpretation/fit), dependencies (document/data), constraints (preservation/controls),
      invariants (corroboration/error bars), collapse conditions (lost link/failed
      control), and consequences (present claim/claim). **Verdict: Bridge is structurally
      sound.**


      **Check 2 — Math ↔ Theology.** The math template traces a chain from DEFINITION
      to RECEIPT; the theology template traces a chain from SOURCE to SCOPE. The math
      chain emphasizes derivation and proof; the theology chain emphasizes proclamation
      and confession. The invariant signature can compare them: both have identities
      (definition/source), distinctions (axiom use/witness tradition), relations (lemma/proclamation),
      operations (derivation/register), dependencies (theorem statement/confession
      class), constraints (receipt/scope), invariants (proof/receipt), collapse conditions
      (failed derivation/failed proclamation), and consequences (theorem/scope). **Verdict:
      Bridge is structurally sound, but the analogy is weaker than History ↔ Physics.**
      The math chain is formal; the theology chain is proclamatory. The signature
      match may be superficial.


      **Check 3 — Physics ↔ Math.** Both templates are formal. The physics chain emphasizes
      measurement; the math chain emphasizes derivation. The invariant signature can
      compare them: both have identities (quantity/definition), distinctions (units/axiom
      use), relations (dynamics/lemma), operations (protocol/derivation), dependencies
      (instrument/theorem statement), constraints (data/receipt), invariants (controls/proof),
      collapse conditions (failed fit/failed derivation), and consequences (claim/theorem).
      **Verdict: Bridge is structurally sound.**


      **Check 4 — Bridge ↔ All.** The bridge template (C13) is meta: it maps any two
      registers. Its integrity depends on the integrity of the source and target templates.
      Since all templates are sound (Section A), the bridge template is sound. **Verdict:
      Sound.**'
    G. Bridge Integrity Summary: '| Bridge | Integrity | Notes |

