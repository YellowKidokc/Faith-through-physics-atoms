    H. Cross-Domain Gaps and Open Problems: 'The following cross-domain gaps are flagged
      as OPEN:


      1. **Admission criteria:** The canon does not specify the criteria for admitting
      an atom into the universal grammar. This is a gap in the bridge between the
      pipeline and the grammar.

      2. **Loss field specification:** The bridge atom''s loss field is mandatory
      but not formally specified. This is a gap in the bridge between source and target
      registers.

      3. **Signature bias:** The invariant signature may impose a formalist bias.
      This is a gap in the bridge between formal and non-formal registers.

      4. **Analyst independence:** The pressure test and Why-Gate are conducted by
      the analyst. This is a gap in the bridge between discovery and validation.

      5. **Worked examples:** The canon provides no worked examples of a full bridge
      from source register to target register. This is a gap in the bridge between
      theory and practice.


      These gaps are consistent with the canon''s own spirit: they are marked OPEN,
      preserved with their rivals and next tests, rather than resolved by fiat.'
    I. Bridge Integrity Verdict: 'The canon''s bridges are structurally sound at the
      level of template design and guard application. The invariant signature provides
      a register-neutral basis for comparison, and the pressure test and Why-Gate
      provide adversarial filters. However, the bridges are weakened by three factors:


      1. **Underdetermined admission:** The universal grammar formula depends on an
      admission procedure that is not fully specified.

      2. **Analyst dependence:** The pressure test and Why-Gate are not independent
      of the analyst.

      3. **Formalist bias:** The invariant signature may favor formal registers over
      narrative or experiential ones.


      These weaknesses do not invalidate the bridges; they mark the boundaries within
      which the bridges are reliable. The canon''s guards (C24) and recursion termini
      (C22) are designed to keep these weaknesses visible rather than hidden. The
      bridges are sound enough to support the canon''s central claim: that a universal
      grammar can emerge bottom-up from admitted atoms and confirmed isomorphisms,
      provided the pipeline is followed with discipline.'
    S09 — Open Questions and Falsification Boundaries: 'The Claim Atom Expansion Canon
      is a methodology that explicitly preserves its unresolved questions rather than
      resolving them by fiat. Its third recursion terminus is OPEN — "an honest unresolved
      terminus. Preserved with its rivals and its next test" (C22). This section applies
      that discipline to the canon itself: it enumerates the open questions the canon
      leaves standing, states what would count as falsification for each of its major
      claims, and marks each boundary with its rivals and next test.'
    A. Open Questions: 'The following questions are not resolved by the canon. They
      are marked OPEN, preserved with their rivals and next tests.


      #### Q1 — What are the admission criteria for the universal grammar?


      The universal grammar is defined as the set of all admitted atoms plus confirmed
      isomorphisms plus typed edges (C21). But the canon does not specify the criteria
      for admitting an atom. It states only that "No automated run canonizes; the
      human rules admission" (C24). This is a procedural guard, not a criterion.


      - **Rivals:** (a) Admission is a primitive human judgment, not further specifiable.
      (b) Admission is determined by the guards alone: an atom is admitted iff it
      satisfies all eight guards. (c) Admission is determined by the IC grade and
      Why-Gate: an atom is admitted iff it has survived expansion, grading, pressure-testing,
      and gating.

      - **Next test:** Attempt to specify admission criteria and test them against
      a corpus of claims. If two analysts applying the same criteria admit different
      atoms, the criteria are underdetermined.


      #### Q2 — How is the loss field of a bridge atom populated?


      The bridge atom''s loss field is mandatory (C13, C20), but the canon does not
      specify what counts as "lost structure." Is it a set, a list, a narrative, a
      formal object?


      - **Rivals:** (a) Loss is a set of structural features present in the source
      but absent in the target. (b) Loss is a narrative description of what the mapping
      fails to preserve. (c) Loss is a formal object defined by the difference between
      the source and target invariant signatures.

      - **Next test:** Apply the bridge template to a concrete cross-register mapping
      and attempt to populate the loss field under each rival. The rival that yields
      a determinate, comparable loss field is preferred.


      #### Q3 — Is the invariant signature register-neutral or formalist-biased?


      The signature''s nine components (C14) are drawn from formal/structural vocabulary.
      They may favor formal registers (math, physics) over narrative or experiential
      ones (history, theology).


      - **Rivals:** (a) The signature is register-neutral; any bias is an artifact
      of application. (b) The signature is formalist-biased and needs additional components
      for narrative/experiential registers. (c) The signature is a Procrustean bed
      and should be replaced by a register-specific comparison method.

      - **Next test:** Apply the signature to a set of claims from each register and
      check whether the signature captures what practitioners of that register consider
      essential. If it systematically misses essential features in some registers,
      the bias is real.


      #### Q4 — Can the analyst''s constructive role be eliminated?


      The pressure test (C18) and Why-Gate (C19) are conducted by the analyst using
      the same templates that produced the candidate. The canon acknowledges this
      (S05, Objection 4) but does not resolve it.


      - **Rivals:** (a) The analyst''s role cannot be eliminated; the best we can
      do is procedural discipline and public reproducibility. (b) Independent replication
      by adversarial collaborators can approximate elimination. (c) The constructive
      role is not a bug but a feature: the analyst''s judgment is the method''s engine.

      - **Next test:** Conduct a blind replication study: two analysts independently
      open the same atoms and compare signatures. Measure inter-analyst agreement.
      If agreement is low, the method is analyst-dependent.


      #### Q5 — What are the levels of WHY_CLOSED?


      The Why-Gate returns WHY_CLOSED (with level), WHY_FAILED, or WHY_OPEN (C19).
      The canon does not enumerate the levels of WHY_CLOSED.


      - **Rivals:** (a) Levels correspond to explanatory depth: surface, mechanism,
      principle, ground. (b) Levels correspond to the register of the explanation:
      historical, physical, mathematical, theological. (c) Levels are not enumerable
      in advance; they are determined case by case.

      - **Next test:** Collect a set of WHY_CLOSED outcomes and attempt to classify
      them by level. If a stable taxonomy emerges, the levels are enumerable.


      #### Q6 — Is the expansion relation well-founded?


      The canon asserts that expansion terminates at one of three termini (C22). But
      it does not prove that every chain terminates. Could there be an infinite chain
      of sub-atoms?


      - **Rivals:** (a) Expansion is well-founded by construction: the templates are
      finite and the termini are exhaustive. (b) Expansion is well-founded only if
      the corpus is finite. (c) Expansion may be non-well-founded for certain self-referential
      claims.

      - **Next test:** Attempt to construct a self-referential claim that opens indefinitely
      without reaching a terminus. If such a claim exists, the well-foundedness claim
      is falsified.


      #### Q7 — Is the universal grammar non-trivial for any non-empty corpus?


      The canon does not prove that the grammar formula (C21) yields a non-trivial
      grammar. If admission is strict, the grammar may be nearly empty.


      - **Rivals:** (a) The grammar is non-trivial for any sufficiently rich corpus.
      (b) The grammar may be trivial; that is a finding about the limits of cross-register
      convergence. (c) The grammar''s non-triviality is an empirical question, not
      a formal one.

      - **Next test:** Apply the pipeline to a real corpus and measure the size and
      structure of the resulting grammar. If the grammar is trivial for a rich corpus,
      the canon''s central claim is weakened.


      #### Q8 — What is the formal definition of the pressure test''s advantage measure?


      The pressure test requires measuring whether the preferred mapping has a "real
      advantage" over rivals (C18). The canon does not define "advantage."


      - **Rivals:** (a) Advantage is the number of structural features preserved by
      the preferred mapping minus those preserved by the rival. (b) Advantage is a
      qualitative judgment by the analyst. (c) Advantage is defined by the IC grade:
      the preferred mapping has advantage iff it achieves a higher grade than any
      rival.

      - **Next test:** Formalize each rival and apply it to a concrete candidate.
      The rival that yields a determinate, reproducible verdict is preferred.


      #### Q9 — Are the three recursion termini exhaustive?


      The canon''s termini are PRIMITIVE, EMPIRICAL INPUT, and OPEN (C22). Are there
      other legitimate termini?


      - **Rivals:** (a) The three termini are exhaustive. (b) There are additional
      termini: UNDEFINED, INCONSISTENT, IRRELEVANT. (c) The termini are methodological,
      not metaphysical; they can be refined in practice.

      - **Next test:** Attempt to construct a claim that cannot be classified under
      any of the three termini without distortion. If such a claim exists, the termini
      are not exhaustive.


      #### Q10 — Does the canon conflate structure with meaning?


      The canon compares claims via invariant signatures (C14), which are structural.
      Two claims may have identical signatures but different meanings.


      - **Rivals:** (a) Structural comparison is a necessary condition for isomorphism;
      meaning enters via the Why-Gate. (b) Structural comparison is insufficient;
      semantic analysis is required. (c) Structure and meaning are not separable;
      the distinction is artificial.

      - **Next test:** Construct two claims with identical invariant signatures but
      different meanings. If the canon cannot distinguish them, the conflation is
      real.'
    B. Falsification Boundaries: 'The canon makes several claims that are, in principle,
      falsifiable. The following table states each claim, what would falsify it, and
      the current status of the test.


      | # | Claim | Falsification condition | Status |

      |---|---|---|---|

      | F1 | The atom is the unit of the corpus (C1). | A corpus in which the atom
      cannot serve as the unit of admission, grading, and reference. | Untested. |

      | F2 | Expansion is register-native (C8). | A claim that cannot be opened along
      its register without distortion, or that opens equally well along any register.
      | Untested. |

      | F3 | The register-native templates are complete (C9–C13). | A claim of a given
      register that requires a sub-atom not present in the template. | Untested. |

      | F4 | The invariant signature is register-neutral (C14). | A register whose
      essential features cannot be represented in the signature. | Partially tested
      (S05, Objection 3; S08, Check 1). |

      | F5 | Isomorphism is discovered, not asserted (C16). | A case where the match
      is demonstrably constructed by the analyst''s choice of template. | Partially
      tested (S05, Objection 4). |

      | F6 | IC-4/IC-5 is a reliable threshold for serious structural convergence
      (C17). | A case where an IC-4/IC-5 isomorphism is later shown to have no structural
      correspondence. | Untested. |

      | F7 | The pressure test filters superficial matches (C18). | A case where a
      superficial match passes the pressure test. | Untested. |

      | F8 | The Why-Gate preserves genuine open questions (C19). | A case where WHY_OPEN
      is used to avoid a genuine WHY_FAILED. | Untested. |

      | F9 | The universal grammar is emergent and bottom-up (C21). | A case where
      the grammar requires a top-down category not derivable from admitted atoms.
      | Untested. |

      | F10 | Expansion is well-founded (C22). | An infinite chain of sub-atoms without
      a terminus. | Untested (Q6). |

      | F11 | The guards prevent the most common failure modes (C24). | A case where
      a claim passes all guards and is later shown to be false. | Untested. |

      | F12 | The canon is falsifiable (S05, Objection 8). | A case where the canon''s
      predictions cannot be tested. | Partially tested (this section). |'
    C. The Falsification Boundary of the Canon Itself: 'The canon''s central claim
      is conditional: *if* you follow the pipeline, *then* you will get a grammar
      that survives scrutiny (C21, C25). This claim is falsifiable in the following
      sense:


      - **Falsification condition:** A corpus processed through the pipeline yields
      a grammar that does not survive scrutiny — i.e., a node or edge in the grammar
      is later shown to be spurious, or the grammar is trivial for a corpus that should
      be rich.

      - **Rival:** The canon is unfalsifiable because any failure can be attributed
      to insufficiently honest scrutiny or an insufficiently rich corpus.

      - **Next test:** Apply the pipeline to a concrete corpus, publish the resulting
      grammar, and invite adversarial scrutiny. If the grammar survives, the canon
      is corroborated. If it does not, the canon is falsified or refined.'
    D. What the Canon Does Not Claim: 'The canon does not claim:


      - That its templates are uniquely correct (S05, Objection 2).

      - That its invariant signature is exhaustive (S05, Objection 3).

      - That its pressure test eliminates the analyst''s constructive role (S05, Objection
      4).

      - That its grammar will be rich (S05, Objection 5).

      - That its termini are exhaustive (S05, Objection 6).

      - That its guards guarantee truth (S05, Objection 7).

      - That it is immune to disconfirmation (S05, Objection 8).

      - That it is practical for all corpora (S05, Objection 9).

      - That it replaces semantic analysis (S05, Objection 10).


      These disclaimers are not weaknesses; they are the canon''s honest boundaries.
      They are marked OPEN, preserved with their rivals and next tests, consistent
      with the canon''s own discipline (C22, C23).'
