  falsificationCondition: 'PRIMARY: exhibit selection of one actual from many permitted
    with no agent and no irreversible cost. SECONDARY: (1) a constraint that collapses
    a multi-member permitted set without an additional term; (2) a fourth candidate
    selector that is neither law, chance, nor agent; (3) demonstration that the three
    scales do not share the four invariants; (4) STRONGEST — demonstration that the
    permitted set is always single-membered, i.e. full determinism, in which case
    nothing is ever selected and the argument is vacuous.'
  priorArt: 'Leibniz 1714 (sufficient reason); Hawking 1988 (''what breathes fire
