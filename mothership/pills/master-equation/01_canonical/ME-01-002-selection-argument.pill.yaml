  name: The Selection Argument — constraints cannot select; selection requires an
    agent term
  term: The Selection Argument — constraints cannot select; selection requires an
    agent term
  plain: 'Rules say what is allowed. They never pick. Building code has never built
    a house — it only says what a legal house must satisfy. If two outcomes are both
    allowed, the rules have said everything they can say and both are still standing.
    Something has to pick one. That picking is not a rule, and adding more rules will
    never produce it. The same picking shows up three times: one universe out of the
    many the laws permit, one measurement outcome out of many, one choice out of two
    open to a person. Each time: many possible, one actual, no going back without
    paying. The framework already calls that W.'
  status: proposed
  target_type: claim
